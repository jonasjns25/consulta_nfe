<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manutenção XML - NF-e</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Inter", "Segoe UI", "Roboto", sans-serif;
      --lumi-primary: #C8102E;
      --lumi-primary-strong: #DB2636;
      --lumi-secondary: #E03C49;
      --lumi-secondary-soft: rgba(200, 16, 46, 0.18);
      --lumi-surface: #FFFFFF;
      --lumi-surface-muted: #FFF8F4;
      --lumi-gradient-start: #FFF8F4;
      --lumi-gradient-end: #FFFFFF;
      --lumi-dark: #222222;
      --lumi-text: #222222;
      --lumi-muted: #3A3A3A;
      --lumi-border: rgba(200, 16, 46, 0.2);
      --success: #00b894;
      --warning: #ffb347;
      --danger: #DB2636;
      --shadow: 0 20px 45px rgba(34, 34, 34, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, var(--lumi-gradient-start), var(--lumi-gradient-end));
      padding: 2.5rem 1.5rem 3rem;
      color: var(--lumi-text);
    }

    header {
      max-width: 1400px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      font-weight: 700;
      color: var(--lumi-dark);
    }

    .btn-voltar {
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(200, 16, 46, 0.08);
      color: var(--lumi-dark);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-voltar:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(34, 34, 34, 0.1);
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background-color: var(--lumi-surface);
      border-radius: 24px;
      padding: 1.9rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--lumi-border);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .card-header .info {
      color: var(--lumi-muted);
      font-size: 0.9rem;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--lumi-primary), var(--lumi-primary-strong));
      color: #fff;
      box-shadow: 0 12px 30px rgba(200, 16, 46, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(200, 16, 46, 0.4);
    }

    .btn-secondary {
      background: rgba(200, 16, 46, 0.08);
      color: var(--lumi-dark);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(200, 16, 46, 0.15);
    }

    .btn-warning {
      background: var(--warning);
      color: #fff;
    }

    .btn-warning:hover:not(:disabled) {
      background: #ffa020;
      transform: translateY(-2px);
    }

    .actions-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .status-banner {
      border-radius: 12px;
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .status-info {
      background-color: var(--lumi-secondary-soft);
      color: var(--lumi-primary-strong);
    }

    .status-success {
      background-color: rgba(31, 157, 105, 0.15);
      color: var(--success);
    }

    .status-warning {
      background-color: rgba(255, 179, 71, 0.2);
      color: #d97706;
    }

    .status-error {
      background-color: rgba(217, 70, 239, 0.15);
      color: var(--danger);
    }

    .itens-container {
      margin-top: 1.5rem;
    }

    .item-card {
      background: var(--lumi-surface-muted);
      border: 1px solid var(--lumi-border);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }

    .item-card.duplicado {
      border-color: var(--warning);
      background: rgba(255, 179, 71, 0.1);
    }

    .item-card.merged {
      border-color: var(--success);
      background: rgba(31, 157, 105, 0.1);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .item-codigo {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--lumi-dark);
    }

    .item-descricao {
      color: var(--lumi-muted);
      font-size: 0.95rem;
    }

    .item-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.8rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .badge-duplicado {
      background-color: rgba(255, 179, 71, 0.2);
      color: #d97706;
    }

    .badge-qtd {
      background-color: rgba(200, 16, 46, 0.15);
      color: var(--lumi-primary-strong);
    }

    .badge-valor {
      background-color: rgba(34, 34, 34, 0.1);
      color: var(--lumi-dark);
    }

    .item-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .detail-label {
      font-size: 0.85rem;
      color: var(--lumi-muted);
      font-weight: 500;
    }

    .detail-value {
      font-size: 0.95rem;
      color: var(--lumi-dark);
      font-weight: 600;
    }

    .table-wrapper {
      width: 100%;
      margin-top: 1rem;
      overflow-x: auto;
      border: 1px solid var(--lumi-border);
      border-radius: 12px;
    }

    .comparacao-table {
      width: 100%;
      min-width: 800px;
      border-collapse: separate;
      border-spacing: 0;
    }

    .comparacao-table thead {
      background-color: rgba(200, 16, 46, 0.08);
      position: sticky;
      top: 0;
    }

    .comparacao-table th {
      padding: 0.75rem 0.5rem;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--lumi-dark);
      border-bottom: 2px solid var(--lumi-border);
      white-space: nowrap;
    }

    .comparacao-table td {
      padding: 0.75rem 0.5rem;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(200, 16, 46, 0.1);
      white-space: nowrap;
    }

    .comparacao-table tbody tr:last-child td {
      border-bottom: none;
    }

    .comparacao-table tbody tr:nth-child(even) {
      background-color: rgba(200, 16, 46, 0.03);
    }

    @media (min-width: 1024px) {
      .comparacao-table th,
      .comparacao-table td {
        padding: 0.75rem;
        font-size: 0.9rem;
      }
    }

    .diferenca {
      color: var(--warning);
      font-weight: 600;
    }

    .media {
      background-color: rgba(31, 157, 105, 0.1);
      color: var(--success);
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      display: inline-block;
    }

    .resumo-diferencas {
      margin-top: 1rem;
      padding: 1rem;
      background-color: rgba(255, 179, 71, 0.1);
      border-left: 4px solid var(--warning);
      border-radius: 8px;
    }

    .resumo-diferencas h4 {
      margin: 0 0 0.75rem 0;
      color: #d97706;
      font-size: 0.95rem;
    }

    .resumo-diferencas ul {
      margin: 0;
      padding-left: 1.5rem;
      color: var(--lumi-muted);
      font-size: 0.9rem;
    }

    .resumo-diferencas li {
      margin-bottom: 0.5rem;
    }

    .loading-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--lumi-primary), var(--lumi-secondary));
      width: 0;
      border-radius: 999px;
      transition: width 0.4s ease;
      margin-top: 0.75rem;
    }

    .loading-bar.active {
      width: 100%;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background-color: var(--lumi-dark);
      color: #fff;
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      box-shadow: 0 20px 30px rgba(34, 34, 34, 0.2);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--lumi-muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 768px) {
      body {
        padding: 1.5rem 1rem;
      }

      .card {
        padding: 1.25rem;
      }

      .actions-bar {
        flex-direction: column;
        width: 100%;
      }

      .actions-bar button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Manutenção XML</h1>
      <p id="chave-info">Carregando informações da NF-e...</p>
    </div>
    <a href="index.html" class="btn-voltar">← Voltar</a>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <div>
          <h2>Análise de Itens Duplicados</h2>
          <span class="info" id="info-text">Analisando XML...</span>
        </div>
        <div class="actions-bar">
          <span class="status-banner status-info" id="status-banner">Carregando...</span>
          <button type="button" class="btn-secondary" id="btn-analisar">Reanalisar</button>
          <button type="button" class="btn-warning" id="btn-unir-todos" disabled>Unir Todos Duplicados</button>
          <button type="button" class="btn-primary" id="btn-salvar" disabled>Salvar Alterações</button>
        </div>
      </div>
      <div class="loading-bar" id="loading-bar"></div>
      
      <div id="itens-container" class="itens-container">
        <!-- Itens serão inseridos aqui via JavaScript -->
      </div>

      <div class="empty-state hidden" id="empty-state">
        <p>Nenhum item encontrado ou não há duplicados.</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const chave = urlParams.get('chave');
    
    if (!chave || !/^\d{44}$/.test(chave)) {
      alert('Chave de acesso inválida.');
      window.location.href = 'index.html';
    }

    const chaveInfo = document.getElementById('chave-info');
    const statusBanner = document.getElementById('status-banner');
    const infoText = document.getElementById('info-text');
    const loadingBar = document.getElementById('loading-bar');
    const itensContainer = document.getElementById('itens-container');
    const emptyState = document.getElementById('empty-state');
    const btnAnalisar = document.getElementById('btn-analisar');
    const btnUnirTodos = document.getElementById('btn-unir-todos');
    const btnSalvar = document.getElementById('btn-salvar');
    const toast = document.getElementById('toast');

    chaveInfo.textContent = `Chave: ${chave}`;

    let xmlOriginal = null;
    let itensProcessados = [];
    let xmlModificado = false;

    // Carregar XML ao iniciar
    carregarXML();

    async function carregarXML() {
      setLoading(true);
      atualizarStatus('Carregando XML...', 'info');
      
      try {
        const resp = await fetch(`/xml-editar/${chave}`);
        if (!resp.ok) {
          throw new Error('Erro ao carregar XML');
        }
        const data = await resp.json();
        xmlOriginal = data.xml;
        analisarItensDuplicados(data.xml);
      } catch (error) {
        console.error(error);
        atualizarStatus('Erro ao carregar XML. Verifique o console.', 'error');
        mostrarToast('Erro ao carregar XML.', true);
      } finally {
        setLoading(false);
      }
    }

    btnAnalisar.addEventListener('click', () => {
      if (xmlOriginal) {
        analisarItensDuplicados(xmlOriginal);
      }
    });

    btnUnirTodos.addEventListener('click', () => {
      unirTodosDuplicados();
    });

    btnSalvar.addEventListener('click', async () => {
      await salvarXML();
    });

    function analisarItensDuplicados(xmlString) {
      setLoading(true);
      atualizarStatus('Analisando itens...', 'info');
      
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
        
        // Verificar erros de parsing
        const parserError = xmlDoc.querySelector('parsererror');
        if (parserError) {
          throw new Error('XML inválido: ' + parserError.textContent);
        }

        // Extrair itens
        const dets = xmlDoc.querySelectorAll('det');
        const itens = [];
        
        dets.forEach((det, index) => {
          const prod = det.querySelector('prod');
          if (!prod) return;
          
          const codigo = prod.querySelector('cProd')?.textContent?.trim() || '';
          const descricao = prod.querySelector('xProd')?.textContent?.trim() || '';
          const quantidade = parseFloat(prod.querySelector('qCom')?.textContent?.replace(',', '.') || '0');
          const valorUnit = parseFloat(prod.querySelector('vUnCom')?.textContent?.replace(',', '.') || '0');
          const valorTotal = parseFloat(prod.querySelector('vProd')?.textContent?.replace(',', '.') || '0');
          const vDesc = parseFloat(prod.querySelector('vDesc')?.textContent?.replace(',', '.') || '0');
          const vProd = valorTotal;
          const cfop = prod.querySelector('CFOP')?.textContent?.trim() || '';
          
          // Extrair informações de ICMS
          const imposto = det.querySelector('imposto');
          let icmsOrig = '';
          let icmsCST = '';
          let icmsAliquota = 0;
          let icmsBaseCalculo = 0;
          let icmsValor = 0;
          
          if (imposto) {
            const icms = imposto.querySelector('ICMS');
            if (icms) {
              // Tentar encontrar qualquer tipo de ICMS (ICMS00, ICMS10, etc.)
              const icmsTypes = ['ICMS00', 'ICMS10', 'ICMS20', 'ICMS30', 'ICMS40', 'ICMS41', 'ICMS50', 'ICMS51', 'ICMS60', 'ICMS70', 'ICMS90', 'ICMS102', 'ICMS500', 'ICMSPart', 'ICMSST', 'ICMSSN101', 'ICMSSN102', 'ICMSSN103', 'ICMSSN201', 'ICMSSN202', 'ICMSSN203', 'ICMSSN300', 'ICMSSN400', 'ICMSSN500', 'ICMSSN900'];
              
              for (const type of icmsTypes) {
                const icmsType = icms.querySelector(type);
                if (icmsType) {
                  icmsOrig = icmsType.querySelector('orig')?.textContent?.trim() || '';
                  icmsCST = icmsType.querySelector('CST')?.textContent?.trim() || icmsType.querySelector('CSOSN')?.textContent?.trim() || '';
                  icmsAliquota = parseFloat(icmsType.querySelector('pICMS')?.textContent?.replace(',', '.') || icmsType.querySelector('pMVAST')?.textContent?.replace(',', '.') || '0');
                  icmsBaseCalculo = parseFloat(icmsType.querySelector('vBC')?.textContent?.replace(',', '.') || '0');
                  icmsValor = parseFloat(icmsType.querySelector('vICMS')?.textContent?.replace(',', '.') || '0');
                  break;
                }
              }
            }
          }
          
          const vDescIgualVProd = Math.abs(vDesc - vProd) < 0.001;
          itens.push({
            index: index + 1,
            nItem: det.getAttribute('nItem') || (index + 1).toString(),
            codigo,
            descricao,
            quantidade,
            valorUnit,
            valorTotal,
            vDesc,
            vProd,
            vDescIgualVProd,
            cfop,
            icmsOrig,
            icmsCST,
            icmsAliquota,
            icmsBaseCalculo,
            icmsValor,
            detElement: det
          });
        });

        // Agrupar por código
        const agrupados = {};
        itens.forEach(item => {
          if (!agrupados[item.codigo]) {
            agrupados[item.codigo] = [];
          }
          agrupados[item.codigo].push(item);
        });

        // Identificar duplicados (mesmo código)
        const duplicados = {};
        Object.keys(agrupados).forEach(codigo => {
          if (agrupados[codigo].length > 1) {
            duplicados[codigo] = agrupados[codigo];
          }
        });

        itensProcessados = itens.map(item => ({
          ...item,
          duplicado: duplicados[item.codigo] ? true : false,
          grupo: duplicados[item.codigo] || null
        }));

        exibirItens(itensProcessados, duplicados);
        
        const totalDuplicados = Object.keys(duplicados).length;
        if (totalDuplicados > 0) {
          atualizarStatus(`Encontrados ${totalDuplicados} grupo(s) de itens duplicados.`, 'warning');
          btnUnirTodos.disabled = false;
        } else {
          atualizarStatus('Nenhum item duplicado encontrado.', 'success');
          btnUnirTodos.disabled = true;
        }
        
      } catch (error) {
        console.error('Erro ao analisar XML:', error);
        atualizarStatus('Erro ao analisar XML: ' + error.message, 'error');
        mostrarToast('Erro ao analisar XML.', true);
      } finally {
        setLoading(false);
      }
    }

    function exibirItens(itens, duplicados) {
      itensContainer.innerHTML = '';
      
      if (itens.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // Seção: Itens com vDesc = vProd (permitir alterar vDesc)
      const itensVDescIgualVProd = itens.filter(item => item.vDescIgualVProd);
      if (itensVDescIgualVProd.length > 0) {
        const cardVDesc = document.createElement('div');
        cardVDesc.className = 'item-card';
        cardVDesc.style.borderLeftColor = 'var(--warning)';
        cardVDesc.style.borderLeftWidth = '4px';
        cardVDesc.style.borderLeftStyle = 'solid';
        cardVDesc.innerHTML = `
          <div class="item-header">
            <div class="item-info">
              <div class="item-codigo">Itens com vDesc = vProd</div>
              <div class="item-descricao">Altere o valor de vDesc quando for igual a vProd (ex.: 0.44 = 0.44)</div>
            </div>
            <button type="button" class="btn-warning" id="btn-aplicar-vdesc">Aplicar correções vDesc</button>
          </div>
          <div class="table-wrapper" style="margin-top: 1rem;">
            <table class="comparacao-table">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Código</th>
                  <th>vProd</th>
                  <th>vDesc (atual)</th>
                  <th>Novo vDesc</th>
                </tr>
              </thead>
              <tbody>
                ${itensVDescIgualVProd.map(item => `
                  <tr>
                    <td><strong>${item.nItem}</strong></td>
                    <td>${item.codigo || '-'}</td>
                    <td>${item.vProd.toFixed(2)}</td>
                    <td>${item.vDesc.toFixed(2)}</td>
                    <td>
                      <input type="number" step="0.01" min="0" 
                        data-nitem="${item.nItem}" 
                        class="input-vdesc" 
                        value="${item.vDesc.toFixed(2)}" 
                        style="width:100px;padding:0.4rem;border-radius:8px;border:1px solid var(--lumi-border);" />
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
        itensContainer.appendChild(cardVDesc);
        cardVDesc.querySelector('#btn-aplicar-vdesc').addEventListener('click', aplicarCorrecaoVDesc);
      }

      // Agrupar itens duplicados
      const grupos = {};
      const itensUnicos = [];

      itens.forEach(item => {
        if (item.duplicado && item.grupo) {
          const codigo = item.codigo;
          if (!grupos[codigo]) {
            grupos[codigo] = [];
          }
          grupos[codigo].push(item);
        } else {
          itensUnicos.push(item);
        }
      });

      // Exibir grupos duplicados primeiro
      Object.keys(grupos).forEach(codigo => {
        const grupo = grupos[codigo];
        const totalQtd = grupo.reduce((sum, item) => sum + item.quantidade, 0);
        const totalValor = grupo.reduce((sum, item) => sum + item.valorTotal, 0);
        
        // Analisar diferenças
        const descricoes = grupo.map(item => item.descricao).filter(d => d);
        const descricoesDiferentes = [...new Set(descricoes)].length > 1;
        
        const qtds = grupo.map(item => item.quantidade);
        const qtdsDiferentes = qtds.some(q => Math.abs(q - qtds[0]) > 0.001);
        
        const valoresUnit = grupo.map(item => item.valorUnit);
        const valoresUnitDiferentes = valoresUnit.some(v => Math.abs(v - valoresUnit[0]) > 0.001);
        const mediaValorUnit = valoresUnit.reduce((sum, v) => sum + v, 0) / valoresUnit.length;
        
        const valoresTotal = grupo.map(item => item.valorTotal);
        const valoresTotalDiferentes = valoresTotal.some(v => Math.abs(v - valoresTotal[0]) > 0.001);
        
        // Analisar CFOP
        const cfops = grupo.map(item => item.cfop).filter(c => c);
        const cfopsDiferentes = [...new Set(cfops)].length > 1;
        
        // Analisar ICMS
        const icmsOrigens = grupo.map(item => item.icmsOrig).filter(o => o);
        const icmsOrigensDiferentes = [...new Set(icmsOrigens)].length > 1;
        
        const icmsCSTs = grupo.map(item => item.icmsCST).filter(c => c);
        const icmsCSTsDiferentes = [...new Set(icmsCSTs)].length > 1;
        
        const icmsAliquotas = grupo.map(item => item.icmsAliquota).filter(a => a > 0);
        const icmsAliquotasDiferentes = icmsAliquotas.length > 0 && icmsAliquotas.some(a => Math.abs(a - icmsAliquotas[0]) > 0.001);
        
        // Calcular média ponderada do valor unitário baseada nas quantidades
        let mediaPonderadaValorUnit = 0;
        if (totalQtd > 0) {
          const somaValores = grupo.reduce((sum, item) => sum + (item.valorUnit * item.quantidade), 0);
          mediaPonderadaValorUnit = somaValores / totalQtd;
        }
        
        // Calcular média ponderada da alíquota ICMS
        let mediaPonderadaICMS = 0;
        if (icmsAliquotas.length > 0 && totalQtd > 0) {
          const somaAliquotasPonderadas = grupo.reduce((sum, item) => {
            return sum + (item.icmsAliquota * item.quantidade);
          }, 0);
          mediaPonderadaICMS = somaAliquotasPonderadas / totalQtd;
        }
        
        const diferencas = [];
        if (descricoesDiferentes) diferencas.push('Descrições diferentes');
        if (qtdsDiferentes) diferencas.push('Quantidades diferentes');
        if (valoresUnitDiferentes) diferencas.push('Valores unitários diferentes');
        if (valoresTotalDiferentes) diferencas.push('Valores totais diferentes');
        if (cfopsDiferentes) diferencas.push('CFOPs diferentes');
        if (icmsOrigensDiferentes) diferencas.push('Origens ICMS diferentes');
        if (icmsCSTsDiferentes) diferencas.push('CSTs ICMS diferentes');
        if (icmsAliquotasDiferentes) diferencas.push('Alíquotas ICMS diferentes');
        
        const card = document.createElement('div');
        card.className = 'item-card duplicado';
        
        let htmlResumoDiferencas = '';
        if (diferencas.length > 0) {
          htmlResumoDiferencas = `
            <div class="resumo-diferencas">
              <h4>⚠️ Diferenças encontradas:</h4>
              <ul>
                ${diferencas.map(d => `<li>${d}</li>`).join('')}
              </ul>
            </div>
          `;
        }
        
        card.innerHTML = `
          <div class="item-header">
            <div class="item-info">
              <div class="item-codigo">Código: ${codigo || '-'}</div>
              <div class="item-descricao">${grupo[0].descricao || '-'}</div>
            </div>
            <div class="item-badges">
              <span class="badge badge-duplicado">${grupo.length} × Duplicado</span>
              <span class="badge badge-qtd">Qtd Total: ${totalQtd.toFixed(3)}</span>
              <span class="badge badge-valor">R$ ${totalValor.toFixed(2)}</span>
              ${valoresUnitDiferentes ? `<span class="badge media">Média Unit: R$ ${mediaPonderadaValorUnit.toFixed(4)}</span>` : ''}
            </div>
          </div>
          ${htmlResumoDiferencas}
          <div class="table-wrapper">
            <table class="comparacao-table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Descrição</th>
                <th>CFOP</th>
                <th>Orig. ICMS</th>
                <th>CST ICMS</th>
                <th>Aliq. ICMS</th>
                <th>Qtd</th>
                <th>Valor Unit.</th>
                <th>Valor Total</th>
              </tr>
            </thead>
            <tbody>
              ${grupo.map(item => `
                <tr>
                  <td><strong>${item.nItem}</strong></td>
                  <td class="${descricoesDiferentes && item.descricao !== grupo[0].descricao ? 'diferenca' : ''}">
                    ${item.descricao || '-'}
                  </td>
                  <td class="${cfopsDiferentes && item.cfop !== grupo[0].cfop ? 'diferenca' : ''}">
                    ${item.cfop || '-'}
                  </td>
                  <td class="${icmsOrigensDiferentes && item.icmsOrig !== grupo[0].icmsOrig ? 'diferenca' : ''}">
                    ${item.icmsOrig || '-'}
                  </td>
                  <td class="${icmsCSTsDiferentes && item.icmsCST !== grupo[0].icmsCST ? 'diferenca' : ''}">
                    ${item.icmsCST || '-'}
                  </td>
                  <td class="${icmsAliquotasDiferentes ? 'diferenca' : ''}">
                    ${item.icmsAliquota > 0 ? `${item.icmsAliquota.toFixed(2)}%` : '-'}
                  </td>
                  <td class="${qtdsDiferentes ? 'diferenca' : ''}">
                    ${item.quantidade.toFixed(3)}
                  </td>
                  <td class="${valoresUnitDiferentes ? 'diferenca' : ''}">
                    R$ ${item.valorUnit.toFixed(4)}
                  </td>
                  <td class="${valoresTotalDiferentes ? 'diferenca' : ''}">
                    R$ ${item.valorTotal.toFixed(2)}
                  </td>
                </tr>
              `).join('')}
              <tr style="background-color: rgba(31, 157, 105, 0.05); font-weight: 600;">
                <td colspan="2"><strong>Totais / Médias</strong></td>
                <td>${cfopsDiferentes ? '<span class="diferenca">Varia</span>' : (grupo[0].cfop || '-')}</td>
                <td>${icmsOrigensDiferentes ? '<span class="diferenca">Varia</span>' : (grupo[0].icmsOrig || '-')}</td>
                <td>${icmsCSTsDiferentes ? '<span class="diferenca">Varia</span>' : (grupo[0].icmsCST || '-')}</td>
                <td>
                  ${icmsAliquotasDiferentes && mediaPonderadaICMS > 0 ? `<span class="media">Média: ${mediaPonderadaICMS.toFixed(2)}%</span>` : (grupo[0].icmsAliquota > 0 ? `${grupo[0].icmsAliquota.toFixed(2)}%` : '-')}
                </td>
                <td>${totalQtd.toFixed(3)}</td>
                <td>
                  ${valoresUnitDiferentes ? `<span class="media">Média: R$ ${mediaPonderadaValorUnit.toFixed(4)}</span>` : `R$ ${grupo[0].valorUnit.toFixed(4)}`}
                </td>
                <td>R$ ${totalValor.toFixed(2)}</td>
              </tr>
            </tbody>
          </table>

        `;
        itensContainer.appendChild(card);
      });

      // Exibir itens únicos (sem duplicação)
      itensUnicos.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-header">
            <div class="item-info">
              <div class="item-codigo">Código: ${item.codigo || '-'}</div>
              <div class="item-descricao">${item.descricao || '-'}</div>
            </div>
            <div class="item-badges">
              <span class="badge badge-qtd">Qtd: ${item.quantidade.toFixed(3)}</span>
              <span class="badge badge-valor">R$ ${item.valorTotal.toFixed(2)}</span>
            </div>
          </div>
        `;
        itensContainer.appendChild(card);
      });

      const totalItens = itens.length;
      const totalDuplicados = Object.keys(duplicados).length;
      infoText.textContent = `${totalItens} item(s) encontrado(s) - ${totalDuplicados} grupo(s) duplicado(s)`;
    }

    function aplicarCorrecaoVDesc() {
      if (!xmlOriginal) return;
      const inputs = document.querySelectorAll('.input-vdesc');
      if (inputs.length === 0) return;
      const alteracoes = [];
      inputs.forEach(inp => {
        const nItem = inp.dataset.nitem;
        const novoValor = parseFloat(inp.value) || 0;
        alteracoes.push({ nItem, novoValor });
      });
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlOriginal, 'text/xml');
        const parserError = xmlDoc.querySelector('parsererror');
        if (parserError) throw new Error('XML inválido');
        alteracoes.forEach(({ nItem, novoValor }) => {
          const det = Array.from(xmlDoc.querySelectorAll('det')).find(d => d.getAttribute('nItem') === nItem);
          if (!det) return;
          const prod = det.querySelector('prod');
          if (!prod) return;
          let vDesc = prod.querySelector('vDesc');
          if (!vDesc) {
            vDesc = xmlDoc.createElement('vDesc');
            prod.appendChild(vDesc);
          }
          vDesc.textContent = novoValor.toFixed(2);
        });
        const serializer = new XMLSerializer();
        xmlOriginal = serializer.serializeToString(xmlDoc);
        xmlModificado = true;
        btnSalvar.disabled = false;
        analisarItensDuplicados(xmlOriginal);
        mostrarToast('Correções de vDesc aplicadas. Clique em Salvar para gravar.');
      } catch (error) {
        console.error('Erro ao aplicar correção vDesc:', error);
        mostrarToast('Erro ao aplicar correções.', true);
      }
    }

    function unirTodosDuplicados() {
      if (!xmlOriginal) return;

      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlOriginal, 'text/xml');
        
        const dets = Array.from(xmlDoc.querySelectorAll('det'));
        
        // Agrupar por código
        const agrupados = {};
        dets.forEach(det => {
          const codigo = det.querySelector('prod > cProd')?.textContent?.trim() || '';
          if (!agrupados[codigo]) {
            agrupados[codigo] = [];
          }
          agrupados[codigo].push(det);
        });

        // Processar apenas grupos duplicados
        Object.keys(agrupados).forEach(codigo => {
          const grupo = agrupados[codigo];
          if (grupo.length > 1) {
            // Pegar o primeiro item como base
            const primeiro = grupo[0];
            const prodBase = primeiro.querySelector('prod');
            const impostoBase = primeiro.querySelector('imposto');
            
            // Inicializar totais
            let totalQtd = 0;
            let totalValor = 0;
            let totalFrete = 0;
            let totalSeguro = 0;
            let totalDesconto = 0;
            let totalOutros = 0;
            
            // Totais de ICMS
            let totalICMS = 0;
            let totalBCICMS = 0;
            let totalBCICMSST = 0;
            let totalICMSST = 0;
            let totalFCP = 0;
            
            // Totais de IPI
            let totalIPI = 0;
            let totalBCIPI = 0;
            
            // Totais de PIS
            let totalPIS = 0;
            let totalBCPIS = 0;
            
            // Totais de COFINS
            let totalCOFINS = 0;
            let totalBCCOFINS = 0;
            
            // Extrair e somar valores de cada item
            grupo.forEach(det => {
              const prod = det.querySelector('prod');
              const imposto = det.querySelector('imposto');
              
              // Produto
              const qtd = parseFloat(prod.querySelector('qCom')?.textContent?.replace(',', '.') || '0');
              const valor = parseFloat(prod.querySelector('vProd')?.textContent?.replace(',', '.') || '0');
              totalQtd += qtd;
              totalValor += valor;
              
              // Valores do produto
              totalFrete += parseFloat(prod.querySelector('vFrete')?.textContent?.replace(',', '.') || '0');
              totalSeguro += parseFloat(prod.querySelector('vSeg')?.textContent?.replace(',', '.') || '0');
              totalDesconto += parseFloat(prod.querySelector('vDesc')?.textContent?.replace(',', '.') || '0');
              totalOutros += parseFloat(prod.querySelector('vOutro')?.textContent?.replace(',', '.') || '0');
              
              if (imposto) {
                // ICMS
                const icms = imposto.querySelector('ICMS');
                if (icms) {
                  // Tentar encontrar qualquer tipo de ICMS
                  const icmsTypes = ['ICMS00', 'ICMS10', 'ICMS20', 'ICMS30', 'ICMS40', 'ICMS41', 'ICMS50', 'ICMS51', 'ICMS60', 'ICMS70', 'ICMS90', 'ICMS102', 'ICMS500', 'ICMSPart', 'ICMSST', 'ICMSSN101', 'ICMSSN102', 'ICMSSN103', 'ICMSSN201', 'ICMSSN202', 'ICMSSN203', 'ICMSSN300', 'ICMSSN400', 'ICMSSN500', 'ICMSSN900'];
                  for (const type of icmsTypes) {
                    const icmsType = icms.querySelector(type);
                    if (icmsType) {
                      totalBCICMS += parseFloat(icmsType.querySelector('vBC')?.textContent?.replace(',', '.') || '0');
                      totalICMS += parseFloat(icmsType.querySelector('vICMS')?.textContent?.replace(',', '.') || '0');
                      totalBCICMSST += parseFloat(icmsType.querySelector('vBCST')?.textContent?.replace(',', '.') || '0');
                      totalICMSST += parseFloat(icmsType.querySelector('vICMSST')?.textContent?.replace(',', '.') || '0');
                      totalFCP += parseFloat(icmsType.querySelector('vFCP')?.textContent?.replace(',', '.') || '0');
                      break;
                    }
                  }
                }
                
                // IPI
                const ipi = imposto.querySelector('IPI');
                if (ipi) {
                  const ipiTrib = ipi.querySelector('IPITrib');
                  if (ipiTrib) {
                    totalBCIPI += parseFloat(ipiTrib.querySelector('vBC')?.textContent?.replace(',', '.') || '0');
                    totalIPI += parseFloat(ipiTrib.querySelector('vIPI')?.textContent?.replace(',', '.') || '0');
                  }
                }
                
                // PIS
                const pis = imposto.querySelector('PIS');
                if (pis) {
                  const pisTypes = ['PISAliq', 'PISQtde', 'PISNT', 'PISOutr', 'PISST'];
                  for (const type of pisTypes) {
                    const pisType = pis.querySelector(type);
                    if (pisType) {
                      totalBCPIS += parseFloat(pisType.querySelector('vBC')?.textContent?.replace(',', '.') || '0');
                      totalPIS += parseFloat(pisType.querySelector('vPIS')?.textContent?.replace(',', '.') || '0');
                      break;
                    }
                  }
                }
                
                // COFINS
                const cofins = imposto.querySelector('COFINS');
                if (cofins) {
                  const cofinsTypes = ['COFINSAliq', 'COFINSQtde', 'COFINSNT', 'COFINSOutr', 'COFINSST'];
                  for (const type of cofinsTypes) {
                    const cofinsType = cofins.querySelector(type);
                    if (cofinsType) {
                      totalBCCOFINS += parseFloat(cofinsType.querySelector('vBC')?.textContent?.replace(',', '.') || '0');
                      totalCOFINS += parseFloat(cofinsType.querySelector('vCOFINS')?.textContent?.replace(',', '.') || '0');
                      break;
                    }
                  }
                }
              }
            });

            // Calcular média ponderada do valor unitário
            let mediaPonderadaUnit = 0;
            if (totalQtd > 0) {
              let somaValoresPonderados = 0;
              grupo.forEach(det => {
                const prod = det.querySelector('prod');
                const qtd = parseFloat(prod.querySelector('qCom')?.textContent?.replace(',', '.') || '0');
                const valorUnit = parseFloat(prod.querySelector('vUnCom')?.textContent?.replace(',', '.') || '0');
                somaValoresPonderados += valorUnit * qtd;
              });
              mediaPonderadaUnit = somaValoresPonderados / totalQtd;
            }
            
            // Atualizar valores do produto
            const qCom = prodBase.querySelector('qCom');
            const vProd = prodBase.querySelector('vProd');
            const vUnCom = prodBase.querySelector('vUnCom');
            
            if (qCom) qCom.textContent = totalQtd.toFixed(4);
            if (vProd) vProd.textContent = totalValor.toFixed(2);
            if (vUnCom && totalQtd > 0) {
              vUnCom.textContent = mediaPonderadaUnit.toFixed(4);
            }
            
            // Atualizar valores adicionais do produto
            if (totalFrete > 0) {
              let vFrete = prodBase.querySelector('vFrete');
              if (!vFrete) {
                vFrete = xmlDoc.createElement('vFrete');
                prodBase.appendChild(vFrete);
              }
              vFrete.textContent = totalFrete.toFixed(2);
            }
            
            if (totalSeguro > 0) {
              let vSeg = prodBase.querySelector('vSeg');
              if (!vSeg) {
                vSeg = xmlDoc.createElement('vSeg');
                prodBase.appendChild(vSeg);
              }
              vSeg.textContent = totalSeguro.toFixed(2);
            }
            
            if (totalDesconto > 0) {
              let vDesc = prodBase.querySelector('vDesc');
              if (!vDesc) {
                vDesc = xmlDoc.createElement('vDesc');
                prodBase.appendChild(vDesc);
              }
              vDesc.textContent = totalDesconto.toFixed(2);
            }
            
            if (totalOutros > 0) {
              let vOutro = prodBase.querySelector('vOutro');
              if (!vOutro) {
                vOutro = xmlDoc.createElement('vOutro');
                prodBase.appendChild(vOutro);
              }
              vOutro.textContent = totalOutros.toFixed(2);
            }
            
            // Atualizar impostos no primeiro item
            if (impostoBase) {
              // ICMS
              const icms = impostoBase.querySelector('ICMS');
              if (icms && (totalICMS > 0 || totalBCICMS > 0)) {
                const icmsTypes = ['ICMS00', 'ICMS10', 'ICMS20', 'ICMS30', 'ICMS40', 'ICMS41', 'ICMS50', 'ICMS51', 'ICMS60', 'ICMS70', 'ICMS90', 'ICMS102', 'ICMS500', 'ICMSPart', 'ICMSST', 'ICMSSN101', 'ICMSSN102', 'ICMSSN103', 'ICMSSN201', 'ICMSSN202', 'ICMSSN203', 'ICMSSN300', 'ICMSSN400', 'ICMSSN500', 'ICMSSN900'];
                for (const type of icmsTypes) {
                  const icmsType = icms.querySelector(type);
                  if (icmsType) {
                    const vBC = icmsType.querySelector('vBC');
                    const vICMS = icmsType.querySelector('vICMS');
                    const vBCST = icmsType.querySelector('vBCST');
                    const vICMSST = icmsType.querySelector('vICMSST');
                    const vFCP = icmsType.querySelector('vFCP');
                    
                    if (vBC && totalBCICMS > 0) vBC.textContent = totalBCICMS.toFixed(2);
                    if (vICMS && totalICMS > 0) vICMS.textContent = totalICMS.toFixed(2);
                    if (vBCST && totalBCICMSST > 0) vBCST.textContent = totalBCICMSST.toFixed(2);
                    if (vICMSST && totalICMSST > 0) vICMSST.textContent = totalICMSST.toFixed(2);
                    if (vFCP && totalFCP > 0) vFCP.textContent = totalFCP.toFixed(2);
                    break;
                  }
                }
              }
              
              // IPI
              const ipi = impostoBase.querySelector('IPI');
              if (ipi && (totalIPI > 0 || totalBCIPI > 0)) {
                let ipiTrib = ipi.querySelector('IPITrib');
                if (!ipiTrib) {
                  ipiTrib = xmlDoc.createElement('IPITrib');
                  ipi.appendChild(ipiTrib);
                }
                const vBC = ipiTrib.querySelector('vBC');
                const vIPI = ipiTrib.querySelector('vIPI');
                if (vBC && totalBCIPI > 0) vBC.textContent = totalBCIPI.toFixed(2);
                if (vIPI && totalIPI > 0) vIPI.textContent = totalIPI.toFixed(2);
              }
              
              // PIS
              const pis = impostoBase.querySelector('PIS');
              if (pis && (totalPIS > 0 || totalBCPIS > 0)) {
                const pisTypes = ['PISAliq', 'PISQtde', 'PISNT', 'PISOutr', 'PISST'];
                for (const type of pisTypes) {
                  const pisType = pis.querySelector(type);
                  if (pisType) {
                    const vBC = pisType.querySelector('vBC');
                    const vPIS = pisType.querySelector('vPIS');
                    if (vBC && totalBCPIS > 0) vBC.textContent = totalBCPIS.toFixed(2);
                    if (vPIS && totalPIS > 0) vPIS.textContent = totalPIS.toFixed(2);
                    break;
                  }
                }
              }
              
              // COFINS
              const cofins = impostoBase.querySelector('COFINS');
              if (cofins && (totalCOFINS > 0 || totalBCCOFINS > 0)) {
                const cofinsTypes = ['COFINSAliq', 'COFINSQtde', 'COFINSNT', 'COFINSOutr', 'COFINSST'];
                for (const type of cofinsTypes) {
                  const cofinsType = cofins.querySelector(type);
                  if (cofinsType) {
                    const vBC = cofinsType.querySelector('vBC');
                    const vCOFINS = cofinsType.querySelector('vCOFINS');
                    if (vBC && totalBCCOFINS > 0) vBC.textContent = totalBCCOFINS.toFixed(2);
                    if (vCOFINS && totalCOFINS > 0) vCOFINS.textContent = totalCOFINS.toFixed(2);
                    break;
                  }
                }
              }
            }

            // Remover itens duplicados (exceto o primeiro)
            grupo.slice(1).forEach(det => {
              det.remove();
            });
          }
        });

        // Renumerar itens sequencialmente (após remover duplicados)
        const novosDets = xmlDoc.querySelectorAll('det');
        novosDets.forEach((det, index) => {
          det.setAttribute('nItem', (index + 1).toString());
        });

        // Não alterar totais globais da NF (ICMSTot) — mudanças limitadas apenas aos itens duplicados

        // Converter de volta para string
        const serializer = new XMLSerializer();
        const novoXml = serializer.serializeToString(xmlDoc);
        
        xmlOriginal = novoXml;
        xmlModificado = true;
        btnSalvar.disabled = false;
        
        // Reanalisar
        analisarItensDuplicados(novoXml);
        mostrarToast('Itens duplicados unidos com sucesso!');
        
      } catch (error) {
        console.error('Erro ao unir duplicados:', error);
        mostrarToast('Erro ao unir itens duplicados.', true);
      }
    }

              const pisType = pis.querySelector(type);
              if (pisType) {
                totalPIS += parseFloat(pisType.querySelector('vPIS')?.textContent?.replace(',', '.') || '0');
                break;
              }
            }
          }
          
          // COFINS
          const cofins = imposto.querySelector('COFINS');
          if (cofins) {
            const cofinsTypes = ['COFINSAliq', 'COFINSQtde', 'COFINSNT', 'COFINSOutr', 'COFINSST'];
            for (const type of cofinsTypes) {
              const cofinsType = cofins.querySelector(type);
              if (cofinsType) {
                totalCOFINS += parseFloat(cofinsType.querySelector('vCOFINS')?.textContent?.replace(',', '.') || '0');
                break;
              }
            }
          }
        }
      });

      // Atualizar totais na NF
      const icmsTot = xmlDoc.querySelector('ICMSTot');
      if (icmsTot) {
        const atualizarCampo = (campo, valor) => {
          let elem = icmsTot.querySelector(campo);
          if (!elem && valor > 0) {
            elem = xmlDoc.createElement(campo);
            icmsTot.appendChild(elem);
          }
          if (elem) elem.textContent = valor.toFixed(2);
        };
        
        atualizarCampo('vProd', totalProdutos);
        atualizarCampo('vFrete', totalFrete);
        atualizarCampo('vSeg', totalSeguro);
        atualizarCampo('vDesc', totalDesconto);
        atualizarCampo('vOutro', totalOutros);
        atualizarCampo('vBC', totalBCICMS);
        atualizarCampo('vICMS', totalICMS);
        atualizarCampo('vBCST', totalBCICMSST);
        atualizarCampo('vST', totalICMSST);
        atualizarCampo('vFCP', totalFCP);
        atualizarCampo('vIPI', totalIPI);
        atualizarCampo('vPIS', totalPIS);
        atualizarCampo('vCOFINS', totalCOFINS);
        
        // Calcular vNF (Valor Total da NF)
        const vNF = totalProdutos + totalFrete + totalSeguro - totalDesconto + totalOutros + totalICMSST - totalICMS + totalIPI;
        atualizarCampo('vNF', vNF);
      }
    }

    async function salvarXML() {
      if (!xmlOriginal || !xmlModificado) return;

      setLoading(true);
      atualizarStatus('Salvando alterações...', 'info');

      try {
        const resp = await fetch(`/xml-salvar/${chave}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ xml: xmlOriginal })
        });

        if (!resp.ok) {
          let mensagemErro = 'Erro ao salvar XML';
          if (resp.status === 413) {
            mensagemErro = 'XML muito grande para ser enviado. Entre em contato com o suporte.';
          } else {
            try {
              const erro = await resp.json();
              mensagemErro = erro.error || mensagemErro;
            } catch (e) {
              mensagemErro = `Erro HTTP ${resp.status}: ${resp.statusText}`;
            }
          }
          throw new Error(mensagemErro);
        }

        const resultado = await resp.json();
        xmlModificado = false;
        btnSalvar.disabled = true;
        
        atualizarStatus('XML salvo com sucesso!', 'success');
        mostrarToast('Alterações salvas com sucesso!');
        
        // Reanalisar para mostrar estado atual
        setTimeout(() => {
          analisarItensDuplicados(xmlOriginal);
        }, 1000);
        
      } catch (error) {
        console.error('Erro ao salvar XML:', error);
        atualizarStatus(error.message || 'Erro ao salvar XML.', 'error');
        mostrarToast(error.message || 'Erro ao salvar XML.', true);
      } finally {
        setLoading(false);
      }
    }

    function setLoading(ativo) {
      loadingBar.classList.toggle('active', ativo);
    }

    function atualizarStatus(mensagem, tipo = 'info') {
      statusBanner.textContent = mensagem;
      statusBanner.className = `status-banner status-${tipo}`;
    }

    function mostrarToast(mensagem, isError = false) {
      toast.textContent = mensagem;
      toast.style.backgroundColor = isError ? '#DB2636' : '#222222';
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 3000);
    }
  </script>
</body>
