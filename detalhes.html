      html += `
        <div class="detalhes-item-comparacao">
          <span class="detalhes-label">${formatarLabel('Valor Seguro')}</span>
          <span class="detalhes-value">${formatarMoeda(produto.valorSeguro)}</span>
          <span class="detalhes-value" style="color: var(--lumi-muted);">-</span>
        </div>
      `;
      
      // Valor Desconto: itemcomp.qtd * itemcomp.desconto (arredondado para 2 casas decimais)
      const desconto = dadosERP
        ? buscarCampo(dadosERP, 'desconto', 'DESCONTO', 'ic_desconto', 'IC_DESCONTO')
        : null;
      let valorDescontoERP = null;
      if (qtd !== null && desconto !== null) {
        const qtdNum = parseFloat(qtd) || 0;
        const descontoNum = parseFloat(desconto) || 0;
        valorDescontoERP = Math.round((qtdNum * descontoNum) * 100) / 100;
      }
      const valorXML_Desconto = produto.valorDesconto || 0;
      const igualDesconto = valorDescontoERP !== null ? compararValores(valorXML_Desconto, valorDescontoERP) : false;
      const corDesconto = igualDesconto ? '#28a745' : '#dc3545';
      html += `
        <div class="detalhes-item-comparacao">
          <span class="detalhes-label">${formatarLabel('Valor Desconto')}</span>
          <span class="detalhes-value">${formatarMoeda(valorXML_Desconto)}</span>
          <span class="detalhes-value" style="color: ${valorDescontoERP !== null ? corDesconto : 'var(--lumi-muted)'};">${valorDescontoERP !== null ? formatarMoeda(valorDescontoERP) : '-'}</span>
        </div>
      `;
      
      // Valor Frete + Valor Outros (ODA): comparação combinada
      // NF não lançada: usar a própria ODA do XML como referência
      // NF lançada: usar itemcomp.QTD * itemcomp.ODA
      const oda = dadosERP ? buscarCampo(dadosERP, 'ODA', 'oda', 'Oda') : null;
      const ehSimuladoODA = ['tabfor', 'embalagem'].includes(String(produto?.dadosERPOrigem || '').trim().toLowerCase());
      let valorCombinadoERP = null;
      if (ehSimuladoODA) {
        valorCombinadoERP = produto.valorOutros || 0;
      } else if (qtd !== null && oda !== null) {
        const qtdNum = parseFloat(qtd) || 0;
        const odaNum = parseFloat(oda) || 0;
        valorCombinadoERP = qtdNum * odaNum;
      }
      const valorXML_Frete = produto.valorFrete || 0;
      const valorXML_Outros = produto.valorOutros || 0;
      const valorCombinadoXML = ehSimuladoODA ? valorXML_Outros : (valorXML_Frete + valorXML_Outros);
      const igualCombinado = valorCombinadoERP !== null ? compararValores(valorCombinadoXML, valorCombinadoERP) : false;
      const corCombinado = igualCombinado ? '#28a745' : '#dc3545';
      html += `
        <div class="detalhes-item-comparacao">
          <span class="detalhes-label">${formatarLabel('Valor Frete')}</span>
          <span class="detalhes-value">${formatarMoeda(valorXML_Frete)}</span>
          <span class="detalhes-value" style="color: var(--lumi-muted);">-</span>
        </div>
        <div class="detalhes-item-comparacao">
          <span class="detalhes-label">${formatarLabel('Valor Outros (ODA)')}</span>
          <span class="detalhes-value">${formatarMoeda(valorXML_Outros)}</span>
          <span class="detalhes-value" style="color: ${valorCombinadoERP !== null ? corCombinado : 'var(--lumi-muted)'};">${valorCombinadoERP !== null ? formatarMoeda(valorCombinadoERP) : '-'}</span>
        </div>
        <div class="detalhes-item-comparacao" style="background: rgba(200, 16, 46, 0.05); border-top: 2px solid rgba(200, 16, 46, 0.2);">
          <span class="detalhes-label" style="font-weight: 700;">${formatarLabel('Frete + Outros (ODA)')}</span>
          <span class="detalhes-value" style="font-weight: 600;">${formatarMoeda(valorCombinadoXML)}</span>
          <span class="detalhes-value" style="color: ${valorCombinadoERP !== null ? corCombinado : 'var(--lumi-muted)'}; font-weight: 600;">${valorCombinadoERP !== null ? formatarMoeda(valorCombinadoERP) : '-'}</span>
        </div>
      `;
      
      // Flag ODA: agora é controlada globalmente pelo checkbox no header da seção de produtos
      // Não exibimos mais checkbox individual por item
      
      // CEST: XML vs SAC — prioridade EMBALAGEM.CEST, senão PRODUTO.CEST
      const cestXMLRaw = produto.cest != null && produto.cest !== undefined ? String(produto.cest).trim() : '';
      const embCestRaw = dadosERP ? buscarCampo(dadosERP, 'embalagem_cest', 'EMBALAGEM_CEST') : null;
      const prodCestRaw = dadosERP ? buscarCampo(dadosERP, 'produto_cest', 'PRODUTO_CEST') : null;
      const cestSacTemInfo = (raw) => {
        const s = raw != null && raw !== undefined ? String(raw).trim() : '';
        if (!s) return false;
        const d = s.replace(/\D/g, '');
        return d !== '' && !/^0+$/.test(d);
      };
      const cestERPraw = cestSacTemInfo(embCestRaw) ? embCestRaw : prodCestRaw;
      const cestERP = cestERPraw != null && cestERPraw !== undefined ? String(cestERPraw).trim() : '';
      const normCest = (v) => {
        const d = String(v ?? '').trim().replace(/\D/g, '');
        if (!d) return '';
        return d.length > 7 ? d.slice(-7) : d.padStart(7, '0');
      };
      const nXml = normCest(cestXMLRaw);
      const nErp = normCest(cestERP);
      const igualCest = (() => {
        const xmlTem = nXml !== '';
        const erpTem = nErp !== '';
        if (erpTem && !xmlTem) return false;
        if (!xmlTem) return !erpTem;
        if (!erpTem) return true;
        return nXml === nErp;
      })();
      const temXmlCest = cestXMLRaw !== '';
      const temErpCest = cestERP !== '';
      let corCestSac;
      if (!temErpCest) {
        corCestSac = 'var(--lumi-muted)';
      } else if (!temXmlCest) {
        corCestSac = '#ffb347';
      } else {
        // Divergência: apenas ponto de atenção (não usar vermelho de erro)
        corCestSac = igualCest ? '#28a745' : '#ffb347';
      }
      html += `
        <div class="detalhes-item-comparacao">
          <span class="detalhes-label">${formatarLabel('CEST')}</span>
          <span class="detalhes-value">${cestXMLRaw || '-'}</span>
          <span class="detalhes-value" style="color: ${corCestSac};">${cestERP || '-'}</span>
        </div>
      `;
      
      if (produto.indEscala) {
        html += `
          <div class="detalhes-item-comparacao">
            <span class="detalhes-label">${formatarLabel('Ind. Escala')}</span>
            <span class="detalhes-value">${produto.indEscala}</span>
            <span class="detalhes-value" style="color: var(--lumi-muted);">-</span>
          </div>
        `;
      }
      
      if (produto.xPed) {
        html += `
          <div class="detalhes-item-comparacao">
            <span class="detalhes-label">${formatarLabel('Nº Pedido')}</span>
            <span class="detalhes-value">${produto.xPed}</span>
            <span class="detalhes-value" style="color: var(--lumi-muted);">-</span>
          </div>
        `;
      }
      
      if (produto.nItemPed) {
        html += `
          <div class="detalhes-item-comparacao">
            <span class="detalhes-label">${formatarLabel('Item do Pedido')}</span>
            <span class="detalhes-value">${produto.nItemPed}</span>
            <span class="detalhes-value" style="color: var(--lumi-muted);">-</span>
          </div>
        `;
      }
      
      if (produto.infAdProd) {
        html += `
          <div class="detalhes-item-comparacao">
            <span class="detalhes-label">${formatarLabel('Informações Adicionais')}</span>
            <span class="detalhes-value" style="word-break: break-word;">${produto.infAdProd}</span>
            <span class="detalhes-value" style="color: var(--lumi-muted);">-</span>
          </div>
        `;
      }
      
      return html;
    }

    function renderizarComparacaoICMS(produto, flagODAForcada = null) {
      const dadosERP = produto.dadosERP;
      
      const cstICMS = produto.icmsCST || '';
      const permiteICMSST = permiteICMSSTNoXML(produto);
      
      // Função auxiliar para buscar campo com variações de maiúsculas/minúsculas
      function buscarCampo(obj, ...nomes) {
        if (!obj) return null;
        for (const nome of nomes) {
          if (obj[nome] !== undefined && obj[nome] !== null) {
            return obj[nome];
          }
          const nomeUpper = nome.toUpperCase();
          if (obj[nomeUpper] !== undefined && obj[nomeUpper] !== null) {
            return obj[nomeUpper];
          }
          const nomeLower = nome.toLowerCase();
          if (obj[nomeLower] !== undefined && obj[nomeLower] !== null) {
            return obj[nomeLower];
          }
        }
        return null;
      }

      // Função auxiliar para comparar valores
      function compararValores(valorXML, valorERP) {
        // Se o ERP tem valor mas o XML não tem, é uma divergência (deve ser corrigido)
        // Para números, considerar que tem valor se não for null/undefined (0 pode ser válido)
        // Para strings, considerar que tem valor se não for null/undefined/vazio
        const erpTemValor = valorERP !== null && valorERP !== undefined && 
                           (typeof valorERP === 'number' ? true : String(valorERP).trim() !== '');
        const xmlTemValor = valorXML !== null && valorXML !== undefined && 
                           (typeof valorXML === 'number' ? true : String(valorXML).trim() !== '');
        
        // Se ERP tem valor mas XML não tem (null/undefined/vazio), é divergência
        if (erpTemValor && !xmlTemValor) {
          return false; // Divergência: ERP tem valor, XML não tem
        }
        
        // Se XML não tem valor, só considerar igual se ERP também não tiver
        if (!xmlTemValor) {
          return !erpTemValor; // Só retorna true se ambos não tiverem valor
        }
        
        // Comparação numérica
        if (typeof valorXML === 'number' && typeof valorERP === 'number') {
          return Math.abs(valorXML - valorERP) < 0.01;
        }
        
        // Comparação de strings
        const xmlStr = String(valorXML).trim().toLowerCase();
        const erpStr = String(valorERP).trim().toLowerCase();
        return xmlStr === erpStr;
      }

      const calculosFiscais = calcularCamposFiscaisComparacao(produto, dadosERP, flagODAForcada);
      const qtd = calculosFiscais.qtd;
      const reducao = calculosFiscais.reducao;
      const cstERP = calculosFiscais.cstERP;
      const modalidadeBCST = calculosFiscais.modalidadeBCST;
      const ehMVA = calculosFiscais.ehMVA;
      const baseCalculoERP = calculosFiscais.baseCalculoERP;
      const aliquotaERP = calculosFiscais.aliquotaERP;
      const valorICMSERP = calculosFiscais.valorICMSERP;
      const aliquotaFCPERP = calculosFiscais.aliquotaFCPERP;
      const baseCalculoFCPERP = calculosFiscais.baseCalculoFCPERP;
      const valorFCPERP = calculosFiscais.valorFCPERP;
      const valorAdicionalST = calculosFiscais.valorAdicionalST;
      const baseCalculoSTERP = calculosFiscais.baseCalculoSTERP;
      const aliquotaICMSSTERP = calculosFiscais.aliquotaICMSSTERP;
      const valorICMSSTERP = calculosFiscais.valorICMSSTERP;
      const aliquotaFCPSTERP = calculosFiscais.aliquotaFCPSTERP;
      const baseCalculoFCPSTERP = calculosFiscais.baseCalculoFCPSTERP;
      const valorFCPSTERP = calculosFiscais.valorFCPSTERP;
      const pauta = dadosERP ? buscarCampo(dadosERP, 'Pauta', 'PAUTA', 'pauta') : null;

      const ehSimplesNacional = !!(produto.icmsCSOSN && String(produto.icmsCSOSN).trim());
      
      let html = `
        <div class="detalhes-item-comparacao" style="border-bottom: 1px solid rgba(200, 16, 46, 0.1); margin-bottom: 0.25rem; padding-bottom: 0.5rem; background: transparent !important;">
          <span style="font-weight: 600; color: var(--lumi-muted);"></span>
          <span class="detalhes-coluna-header" style="margin: 0; padding: 0; border: none; font-weight: 600; color: var(--lumi-muted); max-width: 17ch; min-width: 17ch; width: 17ch; word-wrap: break-word; overflow-wrap: break-word; white-space: normal; text-align: left; box-sizing: border-box;">Inf. XML</span>
          <span class="detalhes-coluna-header" style="margin: 0; padding: 0; border: none; font-weight: 600; color: var(--lumi-muted); max-width: 17ch; min-width: 17ch; width: 17ch; word-wrap: break-word; overflow-wrap: break-word; white-space: normal; text-align: left; box-sizing: border-box;">Inf. SAC</span>
        </div>
      `;
      
      if (ehSimplesNacional) {
        html += `
          <div class="detalhes-item-comparacao" style="background: rgba(0, 150, 136, 0.08); border: 1px solid rgba(0, 150, 136, 0.3); border-radius: 8px; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem;">
            <span style="font-weight: 700; color: #00695c; font-size: 0.9rem;">Fornecedor Simples Nacional</span>
            <span></span>
            <span></span>
          </div>
        `;
      }
      
      // Origem – Tabela A (XML "orig" x produto.atrib do ERP)
      // Tratada como ponto de atencao (laranja), nao como erro (vermelho).
      const valorOrigXML = produto.icmsOrig;
      const atribERP = dadosERP ? buscarCampo(dadosERP, 'produto_atrib', 'ATRIB', 'atrib') : null;
      const xmlOrigStr = (valorOrigXML !== undefined && valorOrigXML !== null && valorOrigXML !== '')
        ? String(valorOrigXML).trim()
        : '';
      const erpOrigStr = (atribERP !== undefined && atribERP !== null && String(atribERP).trim() !== '')
        ? String(atribERP).trim()
        : '';
      const xmlOrigDigito = (xmlOrigStr.match(/[0-8]/) || [''])[0];
      const erpOrigDigito = (erpOrigStr.match(/[0-8]/) || [''])[0];
      const xmlOrigLabel = xmlOrigStr ? traduzirOrigem(xmlOrigStr) : '-';
      const erpOrigLabel = erpOrigStr ? traduzirOrigem(erpOrigStr) : '-';
      let estiloXmlOrig = 'font-size: 0.85rem; line-height: 1.4;';
      let estiloErpOrig = 'color: var(--lumi-muted); font-size: 0.85rem; line-height: 1.4;';
      let badgeOrigem = '';
      if (xmlOrigDigito && erpOrigDigito) {
        if (xmlOrigDigito === erpOrigDigito) {
          estiloXmlOrig += ' color: #1f7a55;';
          estiloErpOrig = 'color: #1f7a55; font-size: 0.85rem; line-height: 1.4;';
        } else {
          // Ponto de atencao, NAO erro.
          estiloXmlOrig += ' color: #b35c00;';
          estiloErpOrig = 'color: #b35c00; font-size: 0.85rem; line-height: 1.4;';
          badgeOrigem = ' <span title="Ponto de atenção: origem do XML difere do cadastro (produto.atrib)" '
            + 'style="background:#fff4e0;color:#b35c00;border:1px solid #b35c00;border-radius:10px;'
            + 'padding:1px 6px;font-size:0.7rem;font-weight:700;margin-left:4px;">⚠ Atenção</span>';
        }
      }
      html += `
        <div class="detalhes-item-comparacao">
          <span class="detalhes-label">${formatarLabel('Origem')}${badgeOrigem}</span>
          <span class="detalhes-value" style="${estiloXmlOrig}">${xmlOrigLabel}</span>
          <span class="detalhes-value" style="${estiloErpOrig}">${erpOrigLabel}</span>
        </div>
      `;
      
      // CST ou CSOSN (Simples Nacional) — exibe um ou outro conforme o regime
      if (ehSimplesNacional) {
        const valorXML_CSOSN = produto.icmsCSOSN || '';
        const igualCSOSN = cstERP ? compararValores(valorXML_CSOSN, cstERP) : false;
        const corCSOSN = igualCSOSN ? '#28a745' : '#dc3545';
        const textoDescrCSOSN = descricaoCSOSN(valorXML_CSOSN);
        html += `
          <div class="detalhes-item-comparacao">
            <span class="detalhes-label">${formatarLabel('CSOSN')}</span>
            <span class="detalhes-value">${valorXML_CSOSN || '-'}</span>
            <span class="detalhes-value" style="color: ${cstERP ? corCSOSN : 'var(--lumi-muted)'};">${cstERP || '-'}</span>
          </div>
        `;
        if (textoDescrCSOSN) {
          html += `
          <div class="detalhes-item-comparacao" style="grid-template-columns: 220px 1fr;">
            <span class="detalhes-label">${formatarLabel('Descrição CSOSN')}</span>
            <span class="detalhes-value" style="grid-column: 2 / -1; font-size: 0.88rem; line-height: 1.35; color: var(--lumi-muted);">${textoDescrCSOSN}</span>
          </div>
        `;
        }
        const pCredSnNum = parseFloat(produto.pCredSN ?? 0) || 0;
        const vCredSnNum = parseFloat(produto.vCredICMSSN ?? 0) || 0;
        if (
          Math.abs(pCredSnNum) > 0.00001 || Math.abs(vCredSnNum) > 0.00001
        ) {
          html += `
          <div class="detalhes-item-comparacao">
            <span class="detalhes-label">${formatarLabel('Alíquota crédito SN (pCredSN)')}</span>
            <span class="detalhes-value">${pCredSnNum.toFixed(4)}%</span>
            <span class="detalhes-value" style="color: var(--lumi-muted);">-</span>
          </div>
          <div class="detalhes-item-comparacao">
            <span class="detalhes-label">${formatarLabel('Valor crédito ICMS SN (vCredICMSSN)')}</span>
            <span class="detalhes-value">${formatarMoeda(vCredSnNum)}</span>
            <span class="detalhes-value" style="color: var(--lumi-muted);">-</span>
          </div>
        `;
        }
      } else {
        const valorXML_CST = produto.icmsCST || '';
        const igualCST = cstERP ? compararValores(valorXML_CST, cstERP) : false;
        const corCST = igualCST ? '#28a745' : '#dc3545';
        html += `
          <div class="detalhes-item-comparacao">
            <span class="detalhes-label">${formatarLabel('CST')}</span>
            <span class="detalhes-value">${valorXML_CST || '-'}</span>
            <span class="detalhes-value" style="color: ${cstERP ? corCST : 'var(--lumi-muted)'};">${cstERP || '-'}</span>
          </div>
        `;
      }
      
      
      
      // Modalidade BC (modBC) - apenas XML
      html += `
        <div class="detalhes-item-comparacao">
          <span class="detalhes-label">${formatarLabel('Modalidade BC (modBC)')}</span>
          <span class="detalhes-value">${traduzirModalidadeBC(produto.icmsModBC)}</span>
          <span class="detalhes-value" style="color: var(--lumi-muted);">-</span>
        </div>
      `;

      // Percentual de Redução da BC (pRedBC)
      // XML: percentual de REDUÇÃO (ex: 47,62%)
      // ERP: percentual RESTANTE (ex: 52,38%) - precisa converter: 100 - reducao = reducaoXML
      // Só deve ser apresentado quando a CST de ICMS for 20 ou 70
      if ((cstICMS === '20' || cstICMS === '70') &&
          produto.icmsRedBC !== undefined && produto.icmsRedBC !== null && !isNaN(produto.icmsRedBC)) {
        const valorXML_RedBC = produto.icmsRedBC; // pRedBC do XML (percentual de REDUÇÃO)
        // Calcular percentual restante do XML (100 - redução)
        const valorXML_Restante = 100 - valorXML_RedBC;
        const textoXML_RedBC = `${valorXML_RedBC.toFixed(4)}% (${valorXML_Restante.toFixed(4)}% restante)`;
        
        // ERP: campo itemcomp.reducao armazena o percentual RESTANTE
        // Conversão: reducaoXML = 100 - reducaoERP
        let valorERP_RedBC = null;
        let reducaoERPOriginal = null;
        let textoERP_RedBC = '-';
        if (reducao !== null && reducao !== undefined && reducao !== '') {
          reducaoERPOriginal = parseFloat(reducao) || 0;
          valorERP_RedBC = 100 - reducaoERPOriginal;
          // Exibir o valor convertido e o valor original do ERP para referência
          textoERP_RedBC = `${valorERP_RedBC.toFixed(4)}% (ERP: ${reducaoERPOriginal.toFixed(4)}% restante)`;
        }
        
        const igualRedBC = valorERP_RedBC !== null ? compararValores(valorXML_RedBC, valorERP_RedBC) : false;
        const corRedBC = igualRedBC ? '#28a745' : '#dc3545';

        html += `
          <div class="detalhes-item-comparacao">
            <span class="detalhes-label">${formatarLabel('Perc. Redução BC (pRedBC)')}</span>
            <span class="detalhes-value" style="font-size: 0.9rem; line-height: 1.4;">${textoXML_RedBC}</span>
            <span class="detalhes-value" style="color: ${valorERP_RedBC !== null ? corRedBC : 'var(--lumi-muted)'}; font-size: 0.9rem; line-height: 1.4;">${textoERP_RedBC}</span>
          </div>
          <div class="detalhes-item-comparacao" style="background: transparent !important; border: none; padding-top: 0; padding-bottom: 0.5rem; grid-template-columns: 220px 1fr;">
            <span style="width: 220px;"></span>
            <span style="font-size: 0.8rem; color: var(--lumi-muted); font-style: italic; line-height: 1.4; padding-left: 0;">
              Nota: XML usa % de REDUÇÃO, ERP usa % RESTANTE. Conversão: Redução = 100% - Restante
            </span>
          </div>
        `;
      }
      
      // Base de Cálculo (vBC)
      const valorXML_BaseCalculo = produto.baseCalculoICMS || 0;
      const igualBaseCalculo = baseCalculoERP !== null ? compararValores(valorXML_BaseCalculo, baseCalculoERP) : false;
      // Usar cor com tolerância para Base de Cálculo ICMS
      const corBaseCalculo = baseCalculoERP !== null ? obterCorImposto(valorXML_BaseCalculo, baseCalculoERP, 'icms') : 'var(--lumi-muted)';
      html += `
        <div class="detalhes-item-comparacao">
          <span class="detalhes-label">${formatarLabel('Base de Cálculo (vBC)')}</span>
          <span class="detalhes-value">${formatarMoeda(valorXML_BaseCalculo)}</span>
          <span class="detalhes-value" style="color: ${baseCalculoERP !== null ? corBaseCalculo : 'var(--lumi-muted)'};">${baseCalculoERP !== null ? formatarMoeda(baseCalculoERP) : '-'}</span>
        </div>
      `;
      
      // Alíquota (pICMS)
      const valorXML_Aliquota = produto.aliquotaICMS || 0;
      const igualAliquota = aliquotaERP !== null ? compararValores(valorXML_Aliquota, aliquotaERP) : false;
      const corAliquota = igualAliquota ? '#28a745' : '#dc3545';
      html += `
        <div class="detalhes-item-comparacao">
          <span class="detalhes-label">${formatarLabel('Alíquota (pICMS)')}</span>
          <span class="detalhes-value">${(valorXML_Aliquota || 0).toFixed(4)}%</span>
          <span class="detalhes-value" style="color: ${aliquotaERP !== null ? corAliquota : 'var(--lumi-muted)'};">${aliquotaERP !== null ? parseFloat(aliquotaERP).toFixed(4) + '%' : '-'}</span>
        </div>

    function renderizarComparacaoIPI(produto, flagODAForcada = null) {

                           (typeof valorXML === 'number' ? true : String(valorXML).trim() !== '');
        
        // Se ERP tem valor mas XML não tem (null/undefined/vazio), é divergência
        if (erpTemValor && !xmlTemValor) {
          return false; // Divergência: ERP tem valor, XML não tem
        }
        
        // Se XML não tem valor, só considerar igual se ERP também não tiver
        if (!xmlTemValor) {
          return !erpTemValor; // Só retorna true se ambos não tiverem valor
        }
        
        // Comparação numérica
        if (typeof valorXML === 'number' && typeof valorERP === 'number') {
          return Math.abs(valorXML - valorERP) < 0.01;
        }
        
        // Comparação de strings
        const xmlStr = String(valorXML).trim().toLowerCase();
        const erpStr = String(valorERP).trim().toLowerCase();
        return xmlStr === erpStr;
      }

      // Calcular base_calculo para IPI (sem a regra de CST 30, 40 ou 60)
      // IMPORTANTE: A redução da base de cálculo do ICMS NÃO se aplica ao IPI
      const qtd = dadosERP ? buscarCampo(dadosERP, 'qtd', 'QTD') : null;
      const valor = dadosERP ? buscarCampo(dadosERP, 'valor', 'VALOR') : null;
      const oda = dadosERP ? buscarCampo(dadosERP, 'ODA', 'oda', 'Oda') : null;
      
      // Base de Cálculo para IPI (sempre calcula, sem verificar CST)
      // Flag ODA: só somar ODA se a flag estiver marcada (por padrão desmarcada)
      // IMPORTANTE: Se ODA do ERP já inclui o frete (quando ODA = Frete+Outros do XML), não somar frete novamente
      let somarODA = flagODAForcada !== null ? flagODAForcada : (window.flagODABCNormal !== undefined ? window.flagODABCNormal : true);
      
      // Calcular ODA total do ERP
      let odaERPTotal = 0;
      if (qtd !== null && oda !== null && somarODA) {
        const qtdNum = parseFloat(qtd) || 0;
        const odaNum = parseFloat(oda) || 0;
        odaERPTotal = qtdNum * odaNum;
      }
      
      // Verificar se ODA do ERP já inclui o frete do XML
      const valorFreteXML = produto.valorFrete || 0;
      const valorOutrosXML = produto.valorOutros || 0;
      const valorCombinadoXML = valorFreteXML + valorOutrosXML;
      const odaJaIncluiFrete = Math.abs(valorCombinadoXML - odaERPTotal) < 0.01;
      
      // Base de Cálculo do IPI: NÃO usa redução da base de cálculo do ICMS
      let baseCalculoERP = null;
      if (ehSimulado) {
        baseCalculoERP = produto.baseCalculoIPI || 0;
      } else if (qtd !== null && valor !== null) {
        const qtdNum = parseFloat(qtd) || 0;
        const valorNum = parseFloat(valor) || 0;
        
        // Se ODA do ERP é zero ou flag está desmarcada, não adicionar nada
        // Se ODA do ERP já inclui frete (corresponde ao XML), usar apenas ODA do ERP
        // Se ODA do ERP NÃO inclui frete, somar ODA do ERP + frete do XML
        let valorAdicional = 0;
        if (somarODA && odaERPTotal > 0) {
          if (odaJaIncluiFrete) {
            // ODA do ERP já inclui o frete
            valorAdicional = odaERPTotal;
          } else {
            // ODA do ERP não inclui frete, então somar ambos
            valorAdicional = odaERPTotal + valorFreteXML;
          }
        } else if (somarODA && odaERPTotal === 0 && valorFreteXML > 0) {
          // Caso especial: ODA zero no ERP mas há frete no XML
          // Não adicionar nada, pois o usuário removeu o ODA/frete no SAC
          valorAdicional = 0;
        }
        
        // IPI: sempre calcula sem redução (qtd * valor + valorAdicional)
        baseCalculoERP = (qtdNum * valorNum) + valorAdicional;
      }
      
      // Alíquota = itemcomp.ipi
      const ipi = dadosERP ? buscarCampo(dadosERP, 'ipi', 'IPI') : null;

      let valorIPIERP = null;

    window.toleranciaImpostos = null;
    
    // Função para verificar se diferença está dentro da tolerância
    // tipoImposto: 'icms' (para ICMS, ICMS-ST, FCP, FCP-ST e bases) ou 'ipi' (para IPI e base IPI)
    function dentroTolerancia(valorXML, valorERP, tipoImposto = 'icms') {
      if (!window.toleranciaImpostos) return false;
      
      const diferenca = valorXML - valorERP;
      
      if (tipoImposto === 'ipi') {
        // Tolerância para IPI
        const toleranciaMais = window.toleranciaImpostos.ipiMais || 0;
        const toleranciaMenos = window.toleranciaImpostos.ipiMenos || 0;
        
        if (diferenca > 0) {
          // XML maior que ERP - usar tolerância para mais
          return diferenca <= toleranciaMais;
        } else if (diferenca < 0) {
          // XML menor que ERP - usar tolerância para menos
          return Math.abs(diferenca) <= toleranciaMenos;
        }
      } else {
        // Tolerância para ICMS/ICMS-ST/FCP/FCP-ST (e bases)
        const toleranciaMais = window.toleranciaImpostos.impMais || 0;
        const toleranciaMenos = window.toleranciaImpostos.impMenos || 0;
        
        if (diferenca > 0) {
          // XML maior que ERP - usar tolerância para mais
          return diferenca <= toleranciaMais;
        } else if (diferenca < 0) {
          // XML menor que ERP - usar tolerância para menos
          return Math.abs(diferenca) <= toleranciaMenos;
        }
      }
      
      return true; // Valores iguais
    }
    
    // Função global para comparar valores de impostos com tolerância
    // Retorna: { igual: boolean, dentroTolerancia: boolean, diferenca: number }
    function compararValoresImposto(valorXML, valorERP, tipoImposto = 'icms') {
      // Normalizar valores
      const xml = typeof valorXML === 'number' ? valorXML : (parseFloat(valorXML) || 0);
      const erp = typeof valorERP === 'number' ? valorERP : (parseFloat(valorERP) || 0);
      
      const diferenca = xml - erp;
      const igual = Math.abs(diferenca) < 0.01;
      
      // Se são iguais, não precisa verificar tolerância
      if (igual) {
        return { igual: true, dentroTolerancia: true, diferenca: 0 };
      }
      
      // Verificar se está dentro da tolerância
      const tolerado = dentroTolerancia(xml, erp, tipoImposto);
      
      return { igual: false, dentroTolerancia: tolerado, diferenca: diferenca };
    }
    
    // Função para obter cor do valor de imposto baseada na comparação e tolerância
    // Verde (#28a745): valores iguais
    // Amarelo/Laranja (#ff9800): diferente mas dentro da tolerância
    // Vermelho (#dc3545): diferente e fora da tolerância
    function obterCorImposto(valorXML, valorERP, tipoImposto = 'icms') {
      if (valorERP === null || valorERP === undefined) return 'var(--lumi-muted)';
      
      const resultado = compararValoresImposto(valorXML, valorERP, tipoImposto);
      
      if (resultado.igual) {
        return '#28a745'; // Verde - valores iguais
      } else if (resultado.dentroTolerancia) {
        return '#ff9800'; // Laranja - dentro da tolerância
      } else {
        return '#dc3545'; // Vermelho - fora da tolerância
      }
    }
    
    // Função para verificar se há erro em imposto (considera tolerância)
    function temErroImposto(valorXML, valorERP, tipoImposto = 'icms') {
      if (valorERP === null || valorERP === undefined) return false;
      
      const resultado = compararValoresImposto(valorXML, valorERP, tipoImposto);
      
      // Só é erro se estiver fora da tolerância
      return !resultado.igual && !resultado.dentroTolerancia;
    }

      return;
    }

    const diagnostics = [];
    const itensParaAtualizar = [];
    const normalizarTributo = (valor) => {
      if (valor === null || valor === undefined || String(valor).trim() === '') return '';
      return String(valor).replace(/\D/g, '').padStart(2, '0').slice(0, 2);
    };

    let totalComparaveis = 0;
    let totalDivergenciaCST = 0;

    window.produtosData.forEach((produto) => {
      try {
        const idx = produto.item || '-';
        const cstXML = String(produto.icmsCST || '').trim();
        const reducaoXML = parseFloat(produto.icmsRedBC || 0) || 0;
        const aliquotaXML = parseFloat(produto.aliquotaICMS || 0) || 0;
        const novaReducao = reducaoXML > 0 ? (100 - reducaoXML) : 0;
        const dadoERP = produto.dadosERP || null;
        const origemERP = String(produto.dadosERPOrigem || '').trim().toLowerCase();
        const tributoERPraw = dadoERP ? buscarCampoERP(dadoERP, 'tributo', 'TRIBUTO') : null;
        const reducaoERPraw = dadoERP ? buscarCampoERP(dadoERP, 'reducao', 'REDUCAO') : null;
        const aliquotaERPraw = dadoERP ? buscarCampoERP(dadoERP, 'aliquota', 'ALIQUOTA') : null;
        const tributoERP = normalizarTributo(tributoERPraw);
        const reducaoERP = parseFloat(reducaoERPraw || 0) || 0;
        const aliquotaERP = parseFloat(aliquotaERPraw || 0) || 0;
        const divergenciaCST = !!(dadoERP && origemERP === 'itemcomp' && cstXML === '20' && tributoERP !== '20');

        if (dadoERP && origemERP === 'itemcomp') {
          totalComparaveis += 1;
          if (divergenciaCST) totalDivergenciaCST += 1;
        }

        let eligible = false;
        let reason = '';

        if (cstXML !== '20') {
          reason = 'Item do XML não está com CST 20';
        } else if (!dadoERP) {
          reason = 'Item sem correspondência no ERP';
        } else if (origemERP !== 'itemcomp') {
          reason = 'Item não está lançado em itemcomp';
        } else if (
          tributoERP === '20' &&
          Math.abs(reducaoERP - novaReducao) < 0.01 &&
          Math.abs(aliquotaERP - aliquotaXML) < 0.01
        ) {
          reason = 'Item já está alinhado com o XML';
        } else {
          eligible = true;
          reason = divergenciaCST ? 'Elegível: divergência de CST detectada' : 'Elegível: ajuste de redução/alíquota';
        }

        const diagnostico = {
          item: idx,
          codigo: produto.codigo || '-',
          cstXML,
          tributoERP: tributoERP || '-',
          tributoNovo: '20',
          reducaoERP,
          reducaoNova: novaReducao,
          aliquotaERP,
          aliquotaNova: aliquotaXML,
          eligible,
          reason
        };
        diagnostics.push(diagnostico);

        if (eligible) {
          const fornece = buscarCampoERP(dadoERP, 'fornece', 'FORNECE') || buscarCampoERP(dadoERP, 'fornec', 'FORNEC') || null;
          const numero = buscarCampoERP(dadoERP, 'numero', 'NUMERO', 'numero_nf', 'NUMERO_NF') || null;
          const estab = buscarCampoERP(dadoERP, 'estab', 'ESTAB') || null;
          const itemERP = buscarCampoERP(dadoERP, 'item', 'ITEM', 'nItem', 'NITEM', 'itemcomp', 'ITEMCOMP') || null;
          const payload = {
            tributo: 20,
            reducao: novaReducao,
            aliquota: aliquotaXML,
            _preview: diagnostico
          };
          if (fornece && numero && estab != null && itemERP != null) {
            itensParaAtualizar.push({ fornece, numero, estab, item: itemERP, ...payload });
          } else {
            diagnostico.eligible = false;
            diagnostico.reason = 'Identificação ERP insuficiente para update';
          }
        }
      } catch (e) {
        console.error('Erro ao avaliar produto para CST 20:', e);
        diagnostics.push({ item: produto.item || '-', codigo: produto.codigo || '-', eligible: false, reason: String(e) });
      }
    });

    const totalItens = window.produtosData.length;
    const todosItensCST20 = totalItens > 0 && window.produtosData.every((produto) => String(produto.icmsCST || '').trim() === '20');
    const maioriaDivergente = totalComparaveis > 0 && totalDivergenciaCST > (totalComparaveis / 2);

    mostrarAnaliseCST20Massa({
      totalItens,
      totalComparaveis,
      totalDivergenciaCST,
      todosItensCST20,
      maioriaDivergente
    }, diagnostics, itensParaAtualizar);
  } catch (error) {
    console.error('Erro ao analisar CST 20 em massa:', error);
    mostrarToast(error.message || 'Erro ao analisar CST 20 em massa.', true);
  }
}

// Função em massa: aplica CST 60 e zera campos para todos os itens que se enquadrem na regra
async function aplicarCST60Massa() {
  try {

      mostrarToast('Dados dos produtos não disponíveis.', true);

    }

    // Construir diagnóstico e lista de itens elegíveis
    const diagnostics = [];
    const itensParaAtualizar = [];

    window.produtosData.forEach((produto) => {
      try {
        const idx = produto.item || '-';
        const cfopXML = String(produto.cfop || '').trim();
        const dadoERP = produto.dadosERP || null;
        const cfopERP = dadoERP ? String(buscarCampoERP(dadoERP, 'cfop', 'CFOP') || '') : '';
        const cstXML = String(produto.icmsCST || '').trim();
        const tributoERPraw = dadoERP ? (buscarCampoERP(dadoERP, 'tributo', 'TRIBUTO') || buscarCampoERP(dadoERP, 'tributo')) : null;
        const tributoERP = tributoERPraw !== null && tributoERPraw !== undefined ? String(tributoERPraw).trim() : null;
        const tributoNorm = tributoERP ? tributoERP.replace(/\D/g, '').padStart(2, '0').slice(0,2) : null;
        const erpHasCSTForST = tributoNorm === '10' || tributoNorm === '30' || tributoNorm === '70';

        let eligible = false;
        let reason = '';

        const compraCFOP = window.compraCFOP ? String(window.compraCFOP).trim() : null;
        const cfopMatch = (cfopXML === '5405') || (String(cfopERP).trim() === '5405') || (compraCFOP === '5405');

        if (!cfopMatch) {
          reason = 'CFOP (XML/ERP/Compra) diferente de 5405';
        } else if (cstXML !== '60') {
          reason = 'CST no XML diferente de 60';
        } else {
          // Critério permissivo: se CFOP==5405 (em qualquer fonte) e CST XML == 60, considerar candidato.
          // Para inclusão no batch é necessário identificar registro no ERP (NSU ou fornece+numero+estab+item).
          if (!dadoERP) {
            eligible = false;
            reason = 'Elegível por XML, mas dadosERP ausente (não identificado para update)';
          } else {
            eligible = true;
            reason = 'Elegível';
          }
        }

        diagnostics.push({
          item: idx,
          cfopXML,
          cfopERP: cfopERP || '-',
          cstXML,
          tributoERP: tributoERPraw ?? '-',
          eligible,
          reason
        });

        if (eligible) {
          const fornece = buscarCampoERP(dadoERP, 'fornece', 'FORNECE') || buscarCampoERP(dadoERP, 'fornec', 'FORNEC') || null;
          const numero = buscarCampoERP(dadoERP, 'numero', 'NUMERO', 'numero_nf', 'NUMERO_NF') || null;
          const estab = buscarCampoERP(dadoERP, 'estab', 'ESTAB') || null;
          const itemERP = buscarCampoERP(dadoERP, 'item', 'ITEM', 'nItem', 'NITEM', 'itemcomp', 'ITEMCOMP') || null;
          if (fornece && numero && estab != null && itemERP != null) {
            itensParaAtualizar.push({ fornece, numero, estab, item: itemERP });
          } else {
            diagnostics[diagnostics.length - 1].eligible = false;
            diagnostics[diagnostics.length - 1].reason = 'Identificação ERP insuficiente para update';
          }
        }
      } catch (e) {
        console.error('Erro ao avaliar produto para atualização em massa:', e);
        diagnostics.push({ item: produto.item || '-', error: String(e) });
      }
    });

    // Se não houver itens elegíveis, mostrar diagnóstico detalhado em modal
    if (itensParaAtualizar.length === 0) {
      mostrarDiagnostico(diagnostics);
      return;
    }

    // Mostrar modal resumindo os itens que serão atualizados e solicitar confirmação
    mostrarConfirmacaoAtualizacao(itensParaAtualizar, diagnostics);
  } catch (error) {
    console.error('Erro ao aplicar atualização em massa:', error);
    mostrarToast(error.message || 'Erro ao aplicar atualização em massa.', true);
  }
}

function contarElegiveisAcao(acaoId) {
  const produtos = window.produtosData || [];
  if (!Array.isArray(produtos) || produtos.length === 0) return 0;

  if (acaoId === 'cst20') {
    const normalizarTributo = (v) => (v == null || String(v).trim() === '') ? '' : String(v).replace(/\D/g, '').padStart(2, '0').slice(0, 2);
    let n = 0;
    produtos.forEach((p) => {
      const cst = String(p.icmsCST || '').trim();
      const reducaoXML = parseFloat(p.icmsRedBC || 0) || 0;
      const aliquotaXML = parseFloat(p.aliquotaICMS || 0) || 0;
      const novaReducao = reducaoXML > 0 ? (100 - reducaoXML) : 0;
      const dadoERP = p.dadosERP;
      const origem = String(p.dadosERPOrigem || '').trim().toLowerCase();
      const tributoERP = normalizarTributo(dadoERP ? buscarCampoERP(dadoERP, 'tributo', 'TRIBUTO') : null);
      const reducaoERP = parseFloat((dadoERP ? buscarCampoERP(dadoERP, 'reducao', 'REDUCAO') : null) || 0) || 0;
      const aliquotaERP = parseFloat((dadoERP ? buscarCampoERP(dadoERP, 'aliquota', 'ALIQUOTA') : null) || 0) || 0;
      if (cst !== '20' || !dadoERP || origem !== 'itemcomp') return;
      if (tributoERP === '20' && Math.abs(reducaoERP - novaReducao) < 0.01 && Math.abs(aliquotaERP - aliquotaXML) < 0.01) return;
      const fornece = buscarCampoERP(dadoERP, 'fornece', 'FORNECE', 'fornec', 'FORNEC');
      const numero = buscarCampoERP(dadoERP, 'numero', 'NUMERO', 'numero_nf', 'NUMERO_NF');
      const estab = buscarCampoERP(dadoERP, 'estab', 'ESTAB');
      const itemERP = buscarCampoERP(dadoERP, 'item', 'ITEM', 'nItem', 'NITEM', 'itemcomp', 'ITEMCOMP');
      if (fornece && numero && estab != null && itemERP != null) n++;
    });
    return n;
  }
  if (acaoId === 'cst60') {
    let n = 0;
    const compraCFOP = window.compraCFOP ? String(window.compraCFOP).trim() : null;
    produtos.forEach((p) => {
      const cfopXML = String(p.cfop || '').trim();
      const cfopERP = p.dadosERP ? String(buscarCampoERP(p.dadosERP, 'cfop', 'CFOP') || '') : '';
      const cst = String(p.icmsCST || '').trim();
      const cfopMatch = cfopXML === '5405' || cfopERP === '5405' || compraCFOP === '5405';
      if (!cfopMatch || cst !== '60' || !p.dadosERP) return;
      const fornece = buscarCampoERP(p.dadosERP, 'fornece', 'FORNECE', 'fornec', 'FORNEC');
      const numero = buscarCampoERP(p.dadosERP, 'numero', 'NUMERO', 'numero_nf', 'NUMERO_NF');
      const estab = buscarCampoERP(p.dadosERP, 'estab', 'ESTAB');
      const itemERP = buscarCampoERP(p.dadosERP, 'item', 'ITEM', 'nItem', 'NITEM', 'itemcomp', 'ITEMCOMP');
      if (fornece && numero && estab != null && itemERP != null) n++;
    });
    return n;
  }
  if (acaoId === 'cst41') {
    let n = 0;
    produtos.forEach((p) => {
      const csosn = String(p.icmsCSOSN || '').trim();
      if (!csosn || !p.dadosERP) return;
      const fornece = buscarCampoERP(p.dadosERP, 'fornece', 'FORNECE', 'fornec', 'FORNEC');
      const numero = buscarCampoERP(p.dadosERP, 'numero', 'NUMERO', 'numero_nf', 'NUMERO_NF');
      const estab = buscarCampoERP(p.dadosERP, 'estab', 'ESTAB');
      const itemERP = buscarCampoERP(p.dadosERP, 'item', 'ITEM', 'nItem', 'NITEM', 'itemcomp', 'ITEMCOMP');
      if (fornece && numero && estab != null && itemERP != null) n++;
    });
    return n;
  }
  if (acaoId === 'odaFrete') {
    let n = 0;
    const comparar = (a, b) => Math.abs((a || 0) - (b || 0)) < 0.01;
    produtos.forEach((p) => {
      const vXML = (p.valorFrete || 0) + (p.valorOutros || 0);
      if (vXML <= 0 || !p.dadosERP) return;
      const qtd = parseFloat(buscarCampoERP(p.dadosERP, 'qtd', 'QTD') || 0) || 0;
      const oda = parseFloat(buscarCampoERP(p.dadosERP, 'ODA', 'oda', 'Oda') || 0) || 0;
      if (comparar(vXML, qtd * oda) || qtd <= 0) return;
      const fornece = buscarCampoERP(p.dadosERP, 'fornece', 'FORNECE', 'fornec', 'FORNEC');
      const numero = buscarCampoERP(p.dadosERP, 'numero', 'NUMERO', 'numero_nf', 'NUMERO_NF');

      const itemERP = buscarCampoERP(p.dadosERP, 'item', 'ITEM', 'nItem', 'NITEM', 'itemcomp', 'ITEMCOMP');
      if (fornece && numero && estab != null && itemERP != null) n++;
    });
    return n;
  }
  if (acaoId === 'stZerado') {
    const zero = (v) => (v || 0) === 0 || Math.abs(v || 0) < 0.01;
    let n = 0;
    produtos.forEach((p) => {
      const cst = String(p.icmsCST || '').trim();
      if (cst !== '10' && cst !== '70') return;
      if (!zero(p.baseCalculoICMSST) || !zero(p.valorICMSST)) return;
      const origem = String(p.dadosERPOrigem || '').trim().toLowerCase();
      if (origem !== 'itemcomp' || !p.dadosERP) return;
      const fornece = buscarCampoERP(p.dadosERP, 'fornece', 'FORNECE', 'fornec', 'FORNEC');
      const numero = buscarCampoERP(p.dadosERP, 'numero', 'NUMERO', 'numero_nf', 'NUMERO_NF');

      const itemERP = buscarCampoERP(p.dadosERP, 'item', 'ITEM', 'nItem', 'NITEM', 'itemcomp', 'ITEMCOMP');
      if (fornece && numero && estab && itemERP != null) n++;
    });
    return n;
  }
  return 0;
}

// Aplica LUCRO=0 e PAUTA=0 em itemcomp para itens com CST 10/70 e Base ST + Valor ICMS ST zerados no XML
function aplicarSTZeradoMassa() {
  try {
    if (!window.produtosData || !Array.isArray(window.produtosData)) {
      mostrarToast('Dados dos produtos não disponíveis.', true);
      return;
    }
    if (window.compraStatus === '4') {
      mostrarToast('Não é possível aplicar em notas com status "NF Recebida".', true);
      return;
    }

    const diagnostics = [];
    const itensParaAtualizar = [];
    const baseSTZero = (v) => (v || 0) === 0 || Math.abs(v || 0) < 0.01;
    const valorICMSSTZero = (v) => (v || 0) === 0 || Math.abs(v || 0) < 0.01;

    for (const produto of window.produtosData) {
      const idx = produto.item || '-';
      const codigo = produto.codigo || '-';
      const cst = String(produto.icmsCST || '').trim();
      const baseST = produto.baseCalculoICMSST ?? 0;
      const valorICMSST = produto.valorICMSST ?? 0;
      const origem = String(produto.dadosERPOrigem || '').trim().toLowerCase();
      const dadosERP = produto.dadosERP;

      let eligible = false;
      let reason = '';

      if (cst !== '10' && cst !== '70') {
        reason = 'CST diferente de 10/70';
      } else if (!baseSTZero(baseST) || !valorICMSSTZero(valorICMSST)) {
        reason = 'Base ST ou Valor ICMS ST não zerados no XML';
      } else if (origem !== 'itemcomp') {
        reason = 'NF não lançada no ERP (itemcomp)';
      } else if (!dadosERP) {
        reason = 'Dados ERP ausentes';
      } else {
        const fornece = buscarCampoERP(dadosERP, 'fornece', 'FORNECE') || buscarCampoERP(dadosERP, 'fornec', 'FORNEC') || null;
        const numero = buscarCampoERP(dadosERP, 'numero', 'NUMERO', 'numero_nf', 'NUMERO_NF') || null;
        const estab = buscarCampoERP(dadosERP, 'estab', 'ESTAB') || null;
        const itemERP = buscarCampoERP(dadosERP, 'item', 'ITEM', 'nItem', 'NITEM', 'itemcomp', 'ITEMCOMP') || null;
        if (fornece && numero && estab && itemERP != null) {
          eligible = true;
          reason = 'Elegível: PAUTA=0, LUCRO=0';
          itensParaAtualizar.push({ fornece, numero, estab, item: itemERP });
        } else {
          eligible = false;
          reason = 'Identificação ERP insuficiente';
        }
      }

      diagnostics.push({ item: idx, codigo, cst, baseST, valorICMSST, eligible, reason });
    }

    if (itensParaAtualizar.length === 0) {
      mostrarDiagnosticoSTZerado(diagnostics);
      return;
    }

    mostrarConfirmacaoSTZerado(itensParaAtualizar, diagnostics);
  } catch (error) {
    console.error('Erro ao analisar ST zerado em massa:', error);
    mostrarToast(error.message || 'Erro ao analisar ST zerado em massa.', true);
  }
}

// Aplica valor Frete+Outros do XML em itemcomp.ODA em lote para itens com frete e divergência
async function aplicarFreteOdaEmLote() {
  try {
    if (!window.produtosData || !Array.isArray(window.produtosData)) {
      mostrarToast('Dados dos produtos não disponíveis.', true);
      return;
    }
    if (window.compraStatus === '4') {
      mostrarToast('Não é possível aplicar frete em ODA em notas com status "NF Recebida".', true);
      return;
    }

    const items = [];
    const valorCombinadoXML = (p) => (p.valorFrete || 0) + (p.valorOutros || 0);
    const compararValoresERP = (a, b) => Math.abs((a || 0) - (b || 0)) < 0.01;

    for (const produto of window.produtosData) {
      const vXML = valorCombinadoXML(produto);
      if (vXML <= 0) continue;

      const dadosERP = produto.dadosERP;
      if (!dadosERP) continue;

      const qtd = buscarCampoERP(dadosERP, 'qtd', 'QTD');
      const oda = buscarCampoERP(dadosERP, 'ODA', 'oda', 'Oda', 'ic_oda', 'IC_ODA');
      const qtdNum = parseFloat(qtd) || 0;
      const odaNum = parseFloat(oda) || 0;
      const valorCombinadoERP = qtdNum * odaNum;

      if (compararValoresERP(vXML, valorCombinadoERP)) continue; // sem divergência

      if (qtdNum <= 0) continue;
      const novoODA = vXML / qtdNum;

      const fornece = buscarCampoERP(dadosERP, 'fornece', 'FORNECE') || buscarCampoERP(dadosERP, 'fornec', 'FORNEC') || null;
      const numero = buscarCampoERP(dadosERP, 'numero', 'NUMERO', 'numero_nf', 'NUMERO_NF') || null;
      const estab = buscarCampoERP(dadosERP, 'estab', 'ESTAB') || null;
      const itemERP = buscarCampoERP(dadosERP, 'item', 'ITEM', 'nItem', 'NITEM', 'itemcomp', 'ITEMCOMP') || null;
      if (fornece && numero && estab != null && itemERP != null) {
        items.push({ fornece, numero, estab, item: itemERP, oda: novoODA });
      }
    }

    if (items.length === 0) {
      mostrarToast('Nenhum item com frete e divergência em ODA encontrado.', true);
      return;
    }

    const chave = new URLSearchParams(window.location.search).get('chave');
    const res = await fetch('/itemcomp/aplicar-oda-frete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chave, items })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      mostrarToast(data.error || 'Erro ao aplicar ODA em massa.', true);
      return;
    }

    mostrarToast(`${data.affectedRows ?? items.length} item(ns) atualizado(s) com sucesso.`);
    if (chave) {
      window.location.href = `detalhes.html?chave=${encodeURIComponent(chave)}`;
    }
  } catch (error) {
    console.error('Erro ao aplicar frete em ODA:', error);
    mostrarToast(error.message || 'Erro ao aplicar frete em ODA.', true);
  }
}
