<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Lumi NF-e</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      font-family: "Inter", "Segoe UI", "Roboto", sans-serif;
      --lumi-primary: #C8102E;
      --lumi-primary-strong: #DB2636;
      --lumi-dark: #222222;
      --lumi-muted: #3A3A3A;
      --lumi-border: rgba(200, 16, 46, 0.2);
      --shadow: 0 20px 45px rgba(34, 34, 34, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top left, #FFF8F4, #FFFFFF);
      color: var(--lumi-dark);
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 24px;
      padding: 2rem 1.75rem 1.75rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--lumi-border);
    }
    .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.1rem; }
    .brand img { height: 128px; width: auto; display: block; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin: 0.85rem 0 0.3rem; }
    input, select {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--lumi-border);
      border-radius: 12px;
      font-size: 1rem;
      background: #fff;
    }
    input:focus, select:focus { outline: 2px solid rgba(200, 16, 46, 0.35); }
    .linha-acesso {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 0.55rem 0.7rem;
      align-items: end;
      margin-top: 0.35rem;
    }
    .nome-usuario {
      min-width: 5.5rem;
      max-width: 9rem;
      padding: 0 0.15rem 0.75rem;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--lumi-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nome-usuario:empty { visibility: hidden; }
    button {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border: 0;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--lumi-primary), var(--lumi-primary-strong));
      box-shadow: 0 12px 30px rgba(200, 16, 46, 0.35);
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .erro {
      display: none;
      margin-top: 0.9rem;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      background: rgba(219, 38, 54, 0.1);
      color: #a71d2a;
      font-size: 0.88rem;
    }
    .erro.visivel { display: block; }
    @media (max-width: 520px) {
      .linha-acesso { grid-template-columns: 1fr; }
      .nome-usuario { padding-bottom: 0; max-width: none; }
      .nome-usuario:empty { display: none; }
    }
  </style>
</head>
<body>
  <form class="card" id="form-login" autocomplete="on">
    <div class="brand">
      <img src="logo-lumi.png" alt="Lumi NF-e">
    </div>
    <div id="bloco-servidor" hidden>
      <label for="servidor">Servidor</label>
      <select id="servidor"></select>
    </div>
    <label for="estab">Área de Acesso</label>
    <select id="estab">
      <option value="ALL" selected>Administrativo</option>
    </select>
    <div class="linha-acesso">
      <div>
        <label for="matricula">Usuário</label>
        <input id="matricula" name="matricula" inputmode="numeric" maxlength="10" required placeholder="0000132" autocomplete="username">
      </div>
      <div class="nome-usuario" id="nome-usuario" aria-live="polite"></div>
      <div>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" maxlength="10" autocomplete="current-password" required>
      </div>
    </div>
    <button type="submit" id="btn">Entrar</button>
    <div class="erro" id="erro" role="alert"></div>
  </form>
  <script>
    function soDigitos(v) { return String(v || '').replace(/\D/g, ''); }
    const STORAGE_SRV = 'lumi_nfe_serverId';
    const selServidor = document.getElementById('servidor');
    const blocoServidor = document.getElementById('bloco-servidor');
    const selEstab = document.getElementById('estab');
    const campoUsuario = document.getElementById('matricula');
    const campoSenha = document.getElementById('senha');
    const nomeUsuario = document.getElementById('nome-usuario');
    let buscaNomeTimer = null;

    function serverIdAtual() { return selServidor.value || ''; }

    function qsAuth(extra) {
      const p = new URLSearchParams(extra || {});
      const id = serverIdAtual();
      if (id) p.set('serverId', id);
      const s = p.toString();
      return s ? ('?' + s) : '';
    }

    function montarOpcoes(lista) {
      const atual = selEstab.value || 'ALL';
      selEstab.innerHTML = '<option value="ALL">Administrativo</option>'
        + (lista || []).map((e) => `<option value="${e.cnpj}">${e.nome}</option>`).join('');
      selEstab.value = [...selEstab.options].some((o) => o.value === atual) ? atual : 'ALL';
    }

    async function carregarServidores() {
      try {
        const resp = await fetch('/api/auth/servidores');
        const data = await resp.json().catch(() => ({}));
        const lista = data.servidores || [];
        const salvo = localStorage.getItem(STORAGE_SRV) || '';
        selServidor.innerHTML = lista.map((s) =>
          `<option value="${s.id}">${s.name}</option>`
        ).join('');
        const preferido = lista.some((s) => s.id === salvo)
          ? salvo
          : (data.atual || (lista[0] && lista[0].id) || '');
        if (preferido) selServidor.value = preferido;
        blocoServidor.hidden = lista.length <= 1;
      } catch (_e) {
        blocoServidor.hidden = true;
      }
    }

    async function mostrarNomeUsuario() {
      const matricula = soDigitos(campoUsuario.value);
      if (matricula.length < 4) {
        nomeUsuario.textContent = '';
        return;
      }
      try {
        const resp = await fetch('/api/auth/usuario' + qsAuth({ matricula }));
        const data = await resp.json().catch(() => ({}));
        nomeUsuario.textContent = data.nome || '';
        nomeUsuario.title = data.nome || '';
      } catch (_e) {
        nomeUsuario.textContent = '';
      }
    }

    async function carregarEstabs() {
      try {
        const resp = await fetch('/api/auth/estabelecimentos' + qsAuth());
        const data = await resp.json().catch(() => ({}));
        montarOpcoes(data.estabelecimentos || []);
      } catch (_e) {
        montarOpcoes([]);
      }
    }

    selServidor.addEventListener('change', () => {
      localStorage.setItem(STORAGE_SRV, selServidor.value);
      nomeUsuario.textContent = '';
      carregarEstabs();
      mostrarNomeUsuario();
    });

    (async function init() {
      await carregarServidores();
      await carregarEstabs();
    })();

    campoUsuario.addEventListener('keydown', async (ev) => {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      await mostrarNomeUsuario();
      campoSenha.focus();
    });
    campoUsuario.addEventListener('blur', () => { mostrarNomeUsuario(); });
    campoUsuario.addEventListener('input', () => {
      clearTimeout(buscaNomeTimer);
      buscaNomeTimer = setTimeout(mostrarNomeUsuario, 350);
    });

    document.getElementById('form-login').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const erro = document.getElementById('erro');
      const btn = document.getElementById('btn');
      erro.classList.remove('visivel');
      btn.disabled = true;
      try {
        if (!selEstab.value) throw new Error('Selecione a área de acesso.');
        const payload = {
          matricula: soDigitos(campoUsuario.value),
          senha: campoSenha.value,
          cnpj: selEstab.value || '',
          serverId: serverIdAtual()
        };
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.erro || 'Falha no login.');
        if (data.precisaEstab) {
          if (data.estabelecimentos && data.estabelecimentos.length) {
            montarOpcoes(data.estabelecimentos);
          }
          erro.textContent = 'Selecione a área de acesso para continuar.';
          erro.classList.add('visivel');
          selEstab.focus();
          return;
        }
        if (payload.serverId) localStorage.setItem(STORAGE_SRV, payload.serverId);
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.href = next.startsWith('/') ? next : '/';
      } catch (e) {
        erro.textContent = e.message || 'Não foi possível entrar.';
        erro.classList.add('visivel');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
